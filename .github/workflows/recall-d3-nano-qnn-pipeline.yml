name: Recall D3 Nano complete QNN dataflow validation
on:
  push:
    branches: [recall-d3-nano-qnn]
    paths: [recall-qnn-pipeline/**, .github/workflows/recall-d3-nano-qnn-pipeline.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: recall-d3-nano-qnn-pipeline
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: '1'
      HF_HOME: /tmp/recall-d3-hf
      D3_WORK: /tmp/recall-d3-qnn-pipeline
      QAI_DEVICE: Samsung Galaxy S26 (Family)
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      D3_FULL_PIPELINE: 'true'
      D3_FUSED_RUN: '38358771714'
      D3_NATIVE_RUN: '38367026693'
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: recall-qnn-pipeline
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install cloud-only numerical dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'qai-hub==0.56.0' 'huggingface-hub>=0.34' safetensors 'numpy<3' 'onnx==1.18.0' 'onnxruntime==1.22.1' 'transformers>=5.0' pillow accelerate 'torchvision==0.23.0' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Validate actual image prompt through all QNN neural stages
        env:
          QAI_HUB_API_TOKEN: ${{ secrets.D3_QAI_HUB_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python recall-qnn-pipeline/convert.py
      - name: Preserve full dataflow accuracy and component profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recall-d3-nano-qnn-full-pipeline
          path: |
            /tmp/recall-d3-qnn-pipeline/report.json
            /tmp/recall-d3-qnn-pipeline/full-pipeline.json
          retention-days: 14
