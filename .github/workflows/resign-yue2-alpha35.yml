name: Re-sign Local Dream alpha.52 with existing canonical key

on:
  push:
    branches:
      - qwen-fp8-turbo
    paths:
      - '.github/workflows/resign-yue2-alpha35.yml'

permissions:
  contents: read
  actions: write

jobs:
  resign:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Restore existing Local Dream signing key
        id: signing-key-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/localdream-ci.jks
          key: localdream-ci-signing-v1

      - name: Require original signing key
        shell: bash
        run: |
          set -euxo pipefail
          test "${{ steps.signing-key-cache.outputs.cache-hit }}" = "true"
          test -s "$RUNNER_TEMP/localdream-ci.jks"

      - name: Download Local Dream alpha.52 and alpha.34 reference
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/yue2" "$RUNNER_TEMP/reference"

          # Never hard-code a run id again. The build workflow uses
          # cancel-in-progress on yue2-text-music, so a later fix can cancel an
          # earlier alpha build while this signer is waiting. Pin the current
          # branch HEAD once, then follow the build attached to that exact SHA.
          target_sha="$(curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/git/ref/heads/yue2-text-music" \
            | jq -r '.object.sha')"
          test -n "$target_sha"
          test "$target_sha" != "null"
          echo "Waiting for yue2-text-music build at $target_sha"

          build_run_id=""
          artifact_id=""
          for attempt in $(seq 1 150); do
            runs_json="$(curl -fsSL --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?branch=yue2-text-music&per_page=100")"
            build_run_id="$(printf '%s' "$runs_json" | jq -r --arg sha "$target_sha" \
              '.workflow_runs[] | select(.head_sha == $sha and .name == "Build Qwen FP8 Turbo APK") | .id' \
              | head -n 1)"

            if [ -n "$build_run_id" ] && [ "$build_run_id" != "null" ]; then
              run_json="$(curl -fsSL --retry 3 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/$build_run_id")"
              status="$(printf '%s' "$run_json" | jq -r '.status')"
              conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion // ""')"
              echo "alpha52 build run=$build_run_id sha=$target_sha status=$status conclusion=$conclusion attempt=$attempt"

              if [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
                echo "alpha52 build failed for target SHA $target_sha" >&2
                exit 1
              fi

              if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
                artifacts_json="$(curl -fsSL --retry 3 \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${{ github.repository }}/actions/runs/$build_run_id/artifacts?per_page=100")"
                artifact_id="$(printf '%s' "$artifacts_json" | jq -r \
                  '.artifacts[] | select(.name == "LocalDream-Qwen-FP8-Turbo" and .expired == false) | .id' \
                  | head -n 1)"
                if [ -n "$artifact_id" ] && [ "$artifact_id" != "null" ]; then
                  break
                fi
              fi
            else
              echo "No build run has appeared for $target_sha yet (attempt $attempt)"
            fi
            sleep 20
          done

          test -n "$build_run_id"
          test "$build_run_id" != "null"
          test -n "$artifact_id"
          test "$artifact_id" != "null"

          curl -fL --retry 5 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" \
            -o "$RUNNER_TEMP/yue2.zip"
          curl -fL --retry 5 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10910931088/zip" \
            -o "$RUNNER_TEMP/reference.zip"
          unzip -q "$RUNNER_TEMP/yue2.zip" -d "$RUNNER_TEMP/yue2"
          unzip -q "$RUNNER_TEMP/reference.zip" -d "$RUNNER_TEMP/reference"
          find "$RUNNER_TEMP/yue2" "$RUNNER_TEMP/reference" -type f -name '*.apk' -ls

      - name: Re-sign without rebuilding
        shell: bash
        run: |
          set -euxo pipefail
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -n 1)"
          test -x "$apksigner_bin"

          src_apk="$(find "$RUNNER_TEMP/yue2" -type f -name '*.apk' | head -n 1)"
          old_apk="$(find "$RUNNER_TEMP/reference" -type f -name '*.apk' | head -n 1)"
          test -s "$src_apk"
          test -s "$old_apk"

          mkdir -p "$GITHUB_WORKSPACE/out"
          out_apk="$GITHUB_WORKSPACE/out/LocalDream-3.0.0-alpha.52-canonical.apk"

          "$apksigner_bin" sign \
            --ks "$RUNNER_TEMP/localdream-ci.jks" \
            --ks-key-alias localdream \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$out_apk" \
            "$src_apk"

          "$apksigner_bin" verify --verbose --print-certs "$out_apk"

          old_cert="$("$apksigner_bin" verify --print-certs "$old_apk" | sed -n 's/^.*Signer.*certificate SHA-256 digest: //p' | head -n 1)"
          new_cert="$("$apksigner_bin" verify --print-certs "$out_apk" | sed -n 's/^.*Signer.*certificate SHA-256 digest: //p' | head -n 1)"

          echo "alpha34 signer: $old_cert"
          echo "alpha52 signer: $new_cert"
          test -n "$old_cert"
          test "$old_cert" = "$new_cert"

          ls -lh "$out_apk"

      - name: Upload compatible APK
        uses: actions/upload-artifact@v6
        with:
          name: LocalDream-alpha52-canonical
          path: out/LocalDream-3.0.0-alpha.52-canonical.apk
          if-no-files-found: error
          retention-days: 14

