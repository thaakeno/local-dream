name: Build Breeze QNN Vocoder

on:
  workflow_dispatch:
  push:
    branches:
      - v141-stable-yue2-full
    paths:
      - 'tools/breeze_qnn/**'
      - '.github/workflows/build-breeze-qnn-vocoder.yml'

permissions:
  contents: write

concurrency:
  group: breeze-qnn-vocoder-sm8850-v3
  cancel-in-progress: true

env:
  QNN_VERSION: '2.50.0.260828'
  QNN_URL: 'https://apigwx-aws.qualcomm.com/qsc/public/v1/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/2.50.0.260828/v2.50.0.260828.zip'
  VOCODER_RELEASE: 'breeze-qnn-vocoder-sm8850-v3'
  VOCODER_FRAMES: '64'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Cache QAIRT SDK
        id: qnn-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qnn-sdk-${{ env.QNN_VERSION }}
          key: qairt-${{ env.QNN_VERSION }}-linux-v1

      - name: Download QAIRT SDK
        if: steps.qnn-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          install_dir="${RUNNER_TEMP}/qnn-sdk-${QNN_VERSION}"
          zip_path="${RUNNER_TEMP}/qnn-sdk.zip"
          mkdir -p "$install_dir"
          curl -fL --retry 5 --retry-delay 2 "$QNN_URL" -o "$zip_path"
          unzip -q "$zip_path" -d "$install_dir"
          rm -f "$zip_path"

      - name: Locate QAIRT SDK
        shell: bash
        run: |
          set -euxo pipefail
          install_dir="${RUNNER_TEMP}/qnn-sdk-${QNN_VERSION}"
          sdk_root=""
          while IFS= read -r d; do
            if [ -d "$d/include/QNN" ] && [ -x "$d/bin/x86_64-linux-clang/qnn-onnx-converter" ]; then
              sdk_root="$d"
              break
            fi
          done < <(find "$install_dir" -maxdepth 4 -type d)
          test -n "$sdk_root"
          test -s "$sdk_root/lib/x86_64-linux-clang/libQnnHtpNetRunExtensions.so"
          echo "QNN_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/bin/x86_64-linux-clang" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$sdk_root/lib/x86_64-linux-clang:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Install QAIRT host runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libc++1 libc++abi1 sox

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install export dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.7.1' 'torchaudio==2.7.1'
          python -m pip install             'numpy==1.26.4' 'onnx==1.18.0' 'onnxruntime==1.22.1' 'onnxscript>=0.3.2' 'onnxsim>=0.4.36'             'huggingface_hub>=0.34.0' 'transformers==4.57.3' 'safetensors>=0.5.3'             'accelerate==1.12.0' 'librosa>=0.11.0' 'soundfile>=0.13.0' 'sox>=1.5.0'             'einops>=0.8.0' 'pandas>=2.2.0' 'tabulate>=0.9.0' 'plotly>=5.20.0'             'xlsxwriter>=3.2.0' 'scipy>=1.14.0' 'scikit-optimize>=0.10.0'             'optuna>=4.0.0' 'rich>=13.9.0' 'pydantic>=2.9.0'             'opencv-python-headless>=4.10.0' 'paramiko>=3.5.0' 'mock>=5.1.0'
          git clone --depth 1 https://github.com/QwenLM/Qwen3-TTS.git "${RUNNER_TEMP}/Qwen3-TTS"
          python -m pip install --no-deps -e "${RUNNER_TEMP}/Qwen3-TTS"
          req="${QNN_SDK_ROOT}/bin/requirements.txt"
          if [ -f "$req" ]; then python -m pip install -r "$req"; fi

      - name: Download Breeze audio tokenizer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${RUNNER_TEMP}/breeze"
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              "BreezeBlue/Breeze-TTS-2",
              local_dir=os.path.join(os.environ["RUNNER_TEMP"], "breeze"),
              allow_patterns=["audio_tokenizer/*", "LICENSE"],
          )
          PY
          test -s "${RUNNER_TEMP}/breeze/audio_tokenizer/model.safetensors"
          test -s "${RUNNER_TEMP}/breeze/LICENSE"

      - name: Export feature-input vocoder and quantizer LUT
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/breeze-qnn
          python tools/breeze_qnn/export_vocoder_onnx.py             --model-dir "${RUNNER_TEMP}/breeze/audio_tokenizer"             --frames "$VOCODER_FRAMES"             --output build/breeze-qnn/breeze_vocoder_64.onnx             --lut-output build/breeze-qnn/breeze_quantizer_lut_fp32.bin

          python - <<'PY'
          import numpy as np, onnx, onnxruntime as ort, torch
          p="build/breeze-qnn/breeze_vocoder_64.onnx"
          onnx.checker.check_model(onnx.load(p))
          ref=torch.load("build/breeze-qnn/breeze_vocoder_64.reference.pt",map_location="cpu")
          sess=ort.InferenceSession(p,providers=["CPUExecutionProvider"])
          assert sess.get_inputs()[0].type=="tensor(float)"
          assert sess.get_outputs()[0].type=="tensor(float)"
          got=sess.run(["audio"],{"quantized":ref["features"].numpy().astype(np.float32)})[0]
          want=ref["audio"].numpy().astype(np.float32)
          err=float(np.max(np.abs(got-want))); mean=float(np.mean(np.abs(got-want)))
          peak=float(np.max(np.abs(got))); rms=float(np.sqrt(np.mean(got*got)))
          print("ONNX max/mean error",err,mean,"peak/rms",peak,rms)
          if not np.isfinite(got).all() or err>2e-3 or peak<1e-3 or rms<5e-5:
              raise SystemExit("ONNX feature-vocoder parity/signal check failed")
          PY
          test -s build/breeze-qnn/breeze_quantizer_lut_fp32.bin
          test -s build/breeze-qnn/breeze_vocoder_64.features.raw
          test -s build/breeze-qnn/breeze_vocoder_64.audio.raw

      - name: Convert ONNX to FP16 QNN model library
        shell: bash
        run: |
          set -euxo pipefail
          export PYTHONPATH="${QNN_SDK_ROOT}/lib/python:${PYTHONPATH:-}"
          export LD_LIBRARY_PATH="${QNN_SDK_ROOT}/lib/x86_64-linux-clang:${LD_LIBRARY_PATH:-}"
          OUT="$GITHUB_WORKSPACE/build/breeze-qnn"
          qnn-onnx-converter             --input_network "$OUT/breeze_vocoder_64.onnx"             --output_path "$OUT/breeze_vocoder_64.cpp"             --float_bitwidth 16             --preserve_io layout quantized audio
          qnn-model-lib-generator             -c "$OUT/breeze_vocoder_64.cpp"             -b "$OUT/breeze_vocoder_64.bin"             -t x86_64-linux-clang             -o "$OUT/model_lib"
          test -s "$OUT/model_lib/x86_64-linux-clang/libbreeze_vocoder_64.so"

      - name: Validate converted graph contract
        shell: bash
        run: |
          set -euxo pipefail
          OUT="$GITHUB_WORKSPACE/build/breeze-qnn"
          test -s "$OUT/breeze_vocoder_64.onnx"
          test -s "$OUT/breeze_vocoder_64.features.raw"
          test -s "$OUT/breeze_vocoder_64.audio.raw"
          test -s "$OUT/breeze_quantizer_lut_fp32.bin"
          test -s "$OUT/model_lib/x86_64-linux-clang/libbreeze_vocoder_64.so"
          python - <<'PY'
          import json
          from pathlib import Path
          meta=json.loads(Path("build/breeze-qnn/breeze_vocoder_64.export.json").read_text())
          assert meta["frames"] == 64
          assert meta["feature_channels"] == 512
          assert meta["feature_layout"] == "NFC"
          assert meta["input_dtype"] == "float32"
          assert meta["output_dtype"] == "float32"
          assert meta["reference_peak"] > 1e-3
          assert meta["reference_rms"] > 5e-5
          assert meta["lut_quantizer_max_abs"] < 1e-2
          assert meta["eager_feature_audio_max_abs"] < 8e-2
          print("feature-vocoder contract OK", meta)
          PY

      - name: Compile native SM8850 V81 HTP context
        shell: bash
        run: |
          set -euxo pipefail
          export LD_LIBRARY_PATH="${QNN_SDK_ROOT}/lib/x86_64-linux-clang:${LD_LIBRARY_PATH:-}"
          OUT="$GITHUB_WORKSPACE/build/breeze-qnn"
          mkdir -p "$OUT/contexts/sm8850" "$OUT/config"

          # QAIRT 2.50 backend-extension schema uses graphs[] and soc_model. Public QAIRT docs map SM8850 to SoC model 87 / Hexagon V81.
          # The old --htp_socs path silently emitted a generic V68 context
          # (socModel=0), which loaded on V81 but returned constant near-zero PCM.
          cat > "$OUT/config/htp_config.json" <<'JSON'
          {
            "graphs": [
              {
                "vtcm_mb": 8,
                "graph_names": ["breeze_vocoder_64"]
              }
            ],
            "devices": [
              {
                "device_id": 0,
                "soc_model": 87,
                "dsp_arch": "v81",
                "cores": [
                  {
                    "core_id": 0,
                    "perf_profile": "burst",
                    "rpc_control_latency": 100
                  }
                ]
              }
            ]
          }
          JSON

          cat > "$OUT/config/context_config.json" <<JSON
          {
            "backend_extensions": {
              "shared_library_path": "${QNN_SDK_ROOT}/lib/x86_64-linux-clang/libQnnHtpNetRunExtensions.so",
              "config_file_path": "$OUT/config/htp_config.json"
            }
          }
          JSON

          qnn-context-binary-generator             --backend "${QNN_SDK_ROOT}/lib/x86_64-linux-clang/libQnnHtp.so"             --model "$OUT/model_lib/x86_64-linux-clang/libbreeze_vocoder_64.so"             --binary_file breeze-vocoder-sm8850-v81-feature64-fp16             --output_dir "$OUT/contexts/sm8850"             --config_file "$OUT/config/context_config.json"             --log_level info

          file="$(find "$OUT/contexts/sm8850" -maxdepth 1 -type f -name 'breeze-vocoder-sm8850-v81-feature64-fp16.*' -print -quit)"
          test -n "$file"; test -s "$file"
          mv "$file" "$OUT/contexts/breeze-vocoder-sm8850-v81-feature64-fp16.bin"
          rm -rf "$OUT/contexts/sm8850"

          qnn-context-binary-utility             --context_binary "$OUT/contexts/breeze-vocoder-sm8850-v81-feature64-fp16.bin"             --json_file "$OUT/contexts/context-info.json"

          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("build/breeze-qnn/contexts/context-info.json")
          data=json.loads(p.read_text())
          info=data["info"]
          graph=info["graphs"][0]["info"]
          text=json.dumps(data)
          dsp_arch=info["contextMetadata"]["info"]["dspArch"]
          soc_model=info["socModel"]
          print("compiled target socModel=",soc_model,"dspArch=",dsp_arch)
          if dsp_arch != 81:
              raise SystemExit(f"WRONG HTP ARCH: expected V81, context contains V{dsp_arch}")
          if soc_model != 87:
              raise SystemExit(f"WRONG SOC MODEL: expected SM8850/87, context contains {soc_model}")
          if graph["graphName"] != "breeze_vocoder_64":
              raise SystemExit("wrong graph name")
          gi=graph["graphInputs"][0]["info"]
          go=graph["graphOutputs"][0]["info"]
          if gi["name"] != "quantized" or gi["dataType"] != "QNN_DATATYPE_FLOAT_16":
              raise SystemExit("compiled QNN context lost expected FP16 input contract")
          if go["name"] != "audio" or go["dataType"] != "QNN_DATATYPE_FLOAT_16":
              raise SystemExit("compiled QNN context lost expected FP16 output contract")
          print("native SM8850 V81 context contract OK")
          PY

          cp "$OUT/breeze_quantizer_lut_fp32.bin" "$OUT/contexts/breeze-quantizer-lut-fp32.bin"
          cp "$OUT/breeze_vocoder_64.features.raw" "$OUT/contexts/breeze-vocoder-selftest-features-fp32.bin"
          cp "$OUT/breeze_vocoder_64.audio.raw" "$OUT/contexts/breeze-vocoder-selftest-audio-fp32.bin"

      - name: Build manifest and licensing
        shell: bash
        run: |
          set -euxo pipefail
          OUT=build/breeze-qnn/contexts
          cp "${RUNNER_TEMP}/breeze/LICENSE" "$OUT/LICENSE-Breeze-TTS-2.txt"
          cat > "$OUT/NOTICE-Breeze-QNN-Vocoder.txt" <<'EOF'
          Breeze TTS 2 is licensed under the BreezeBlue Research and Non-Commercial
          License Agreement. Copyright (c) 2026 RESONIA, INC. All Rights Reserved.
          Modification: the released decoder is converted to an SM8850 / Hexagon V81
          QAIRT/QNN HTP context. The residual-vector-quantizer rows are preprojected
          into an FP32 lookup table. Reference input/output tensors are included only
          for on-device numerical self-validation.
          EOF

          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("build/breeze-qnn/contexts")
          def spec(name):
              d=(root/name).read_bytes()
              return {"file":name,"bytes":len(d),"sha256":hashlib.sha256(d).hexdigest()}
          manifest={
            "version":3,
            "backend":"QAIRT/QNN HTP FP16 feature-input native SM8850 V81",
            "qnn_version":"2.50.0.260828",
            "soc_model":87,
            "htp_arch":"V81",
            "frames":64,"left_context_frames":25,"samples_per_frame":1920,
            "sample_rate":24000,"feature_channels":512,"feature_layout":"NFC",
            "qnn_input_dtype":"float16","qnn_output_dtype":"float16",
            "source":"BreezeBlue/Breeze-TTS-2 audio_tokenizer",
            "license":"BreezeBlue Research and Non-Commercial License v1.1",
            "files":{"SM8850":{
              "context":spec("breeze-vocoder-sm8850-v81-feature64-fp16.bin"),
              "lut":spec("breeze-quantizer-lut-fp32.bin"),
              "selftest_features":spec("breeze-vocoder-selftest-features-fp32.bin"),
              "selftest_audio":spec("breeze-vocoder-selftest-audio-fp32.bin")
            }}
          }
          (root/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print(json.dumps(manifest,indent=2))
          PY
          (cd "$OUT" && sha256sum *.bin LICENSE-Breeze-TTS-2.txt NOTICE-Breeze-QNN-Vocoder.txt > SHA256SUMS.txt)
          ls -lh "$OUT"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v6
        with:
          name: Breeze-QNN-Vocoder-SM8850-v3
          path: build/breeze-qnn/contexts/*
          retention-days: 14
          if-no-files-found: error

      - name: Publish SM8850 v3 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          if ! gh release view "$VOCODER_RELEASE" >/dev/null 2>&1; then
            gh release create "$VOCODER_RELEASE"               --title "Breeze QNN Vocoder SM8850 v3"               --notes "SM8850/Hexagon V81 QAIRT QNN HTP vocoder with on-device numerical self-test. Derived from Breeze TTS 2; research/non-commercial use only."
          fi
          gh release upload "$VOCODER_RELEASE" build/breeze-qnn/contexts/* --clobber
