name: Build Breeze QNN Vocoder

on:
  workflow_dispatch:
  push:
    branches:
      - v141-stable-yue2-full
    paths:
      - 'tools/breeze_qnn/**'
      - '.github/workflows/build-breeze-qnn-vocoder.yml'

permissions:
  contents: write

concurrency:
  group: breeze-qnn-vocoder-sm8850-v2
  cancel-in-progress: true

env:
  QNN_VERSION: '2.50.0.260828'
  QNN_URL: 'https://apigwx-aws.qualcomm.com/qsc/public/v1/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/2.50.0.260828/v2.50.0.260828.zip'
  VOCODER_RELEASE: 'breeze-qnn-vocoder-sm8850-v2'
  VOCODER_FRAMES: '64'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Cache QAIRT SDK
        id: qnn-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qnn-sdk-${{ env.QNN_VERSION }}
          key: qairt-${{ env.QNN_VERSION }}-linux-v1

      - name: Download QAIRT SDK
        if: steps.qnn-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          install_dir="${RUNNER_TEMP}/qnn-sdk-${QNN_VERSION}"
          zip_path="${RUNNER_TEMP}/qnn-sdk.zip"
          mkdir -p "$install_dir"
          curl -fL --retry 5 --retry-delay 2 "$QNN_URL" -o "$zip_path"
          unzip -q "$zip_path" -d "$install_dir"
          rm -f "$zip_path"

      - name: Locate QAIRT SDK
        shell: bash
        run: |
          set -euxo pipefail
          install_dir="${RUNNER_TEMP}/qnn-sdk-${QNN_VERSION}"
          sdk_root=""
          while IFS= read -r d; do
            if [ -d "$d/include/QNN" ] && [ -x "$d/bin/x86_64-linux-clang/qnn-onnx-converter" ]; then
              sdk_root="$d"
              break
            fi
          done < <(find "$install_dir" -maxdepth 4 -type d)
          test -n "$sdk_root"
          echo "QNN_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/bin/x86_64-linux-clang" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$sdk_root/lib/x86_64-linux-clang:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Install QAIRT host runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libc++1 libc++abi1 sox

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install export dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.7.1' 'torchaudio==2.7.1'
          python -m pip install             'numpy==1.26.4' 'onnx==1.18.0' 'onnxruntime==1.22.1' 'onnxscript>=0.3.2'             'huggingface_hub>=0.34.0' 'transformers==4.57.3' 'safetensors>=0.5.3'             'accelerate==1.12.0' 'librosa>=0.11.0' 'soundfile>=0.13.0' 'sox>=1.5.0'             'einops>=0.8.0' 'pandas>=2.2.0' 'tabulate>=0.9.0' 'plotly>=5.20.0'             'xlsxwriter>=3.2.0' 'scipy>=1.14.0' 'scikit-optimize>=0.10.0'             'optuna>=4.0.0' 'rich>=13.9.0' 'pydantic>=2.9.0'             'opencv-python-headless>=4.10.0' 'paramiko>=3.5.0' 'mock>=5.1.0'
          git clone --depth 1 https://github.com/QwenLM/Qwen3-TTS.git "${RUNNER_TEMP}/Qwen3-TTS"
          python -m pip install --no-deps -e "${RUNNER_TEMP}/Qwen3-TTS"
          req="${QNN_SDK_ROOT}/bin/requirements.txt"
          if [ -f "$req" ]; then python -m pip install -r "$req"; fi

      - name: Download Breeze audio tokenizer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${RUNNER_TEMP}/breeze"
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              "BreezeBlue/Breeze-TTS-2",
              local_dir=os.path.join(os.environ["RUNNER_TEMP"], "breeze"),
              allow_patterns=["audio_tokenizer/*", "LICENSE"],
          )
          PY
          test -s "${RUNNER_TEMP}/breeze/audio_tokenizer/model.safetensors"
          test -s "${RUNNER_TEMP}/breeze/LICENSE"

      - name: Export feature-input vocoder and quantizer LUT
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/breeze-qnn
          python tools/breeze_qnn/export_vocoder_onnx.py             --model-dir "${RUNNER_TEMP}/breeze/audio_tokenizer"             --frames "$VOCODER_FRAMES"             --output build/breeze-qnn/breeze_vocoder_64.onnx             --lut-output build/breeze-qnn/breeze_quantizer_lut_fp32.bin

          python - <<'PY'
          import numpy as np, onnx, onnxruntime as ort, torch
          p="build/breeze-qnn/breeze_vocoder_64.onnx"
          onnx.checker.check_model(onnx.load(p))
          ref=torch.load("build/breeze-qnn/breeze_vocoder_64.reference.pt",map_location="cpu")
          sess=ort.InferenceSession(p,providers=["CPUExecutionProvider"])
          assert sess.get_inputs()[0].type=="tensor(float)"
          assert sess.get_outputs()[0].type=="tensor(float)"
          got=sess.run(["audio"],{"quantized":ref["features"].numpy().astype(np.float32)})[0]
          want=ref["audio"].numpy().astype(np.float32)
          err=float(np.max(np.abs(got-want))); mean=float(np.mean(np.abs(got-want)))
          peak=float(np.max(np.abs(got))); rms=float(np.sqrt(np.mean(got*got)))
          print("ONNX max/mean error",err,mean,"peak/rms",peak,rms)
          if not np.isfinite(got).all() or err>2e-3 or peak<1e-3 or rms<5e-5:
              raise SystemExit("ONNX feature-vocoder parity/signal check failed")
          PY
          test -s build/breeze-qnn/breeze_quantizer_lut_fp32.bin

      - name: Convert ONNX to FP16 QNN model library
        shell: bash
        run: |
          set -euxo pipefail
          export PYTHONPATH="${QNN_SDK_ROOT}/lib/python:${PYTHONPATH:-}"
          export LD_LIBRARY_PATH="${QNN_SDK_ROOT}/lib/x86_64-linux-clang:${LD_LIBRARY_PATH:-}"
          OUT="$GITHUB_WORKSPACE/build/breeze-qnn"
          qnn-onnx-converter             --input_network "$OUT/breeze_vocoder_64.onnx"             --output_path "$OUT/breeze_vocoder_64.cpp"             --float_bitwidth 16             --preserve_io
          qnn-model-lib-generator             -c "$OUT/breeze_vocoder_64.cpp"             -b "$OUT/breeze_vocoder_64.bin"             -t x86_64-linux-clang             -o "$OUT/model_lib"
          test -s "$OUT/model_lib/x86_64-linux-clang/libbreeze_vocoder_64.so"

      - name: Validate converted QNN graph on CPU backend
        shell: bash
        run: |
          set -euxo pipefail
          export LD_LIBRARY_PATH="${QNN_SDK_ROOT}/lib/x86_64-linux-clang:${LD_LIBRARY_PATH:-}"
          OUT="$GITHUB_WORKSPACE/build/breeze-qnn"
          echo "$OUT/breeze_vocoder_64.features.raw" > "$OUT/input_list.txt"
          rm -rf "$OUT/qnn-cpu"
          qnn-net-run             --backend "${QNN_SDK_ROOT}/lib/x86_64-linux-clang/libQnnCpu.so"             --model "$OUT/model_lib/x86_64-linux-clang/libbreeze_vocoder_64.so"             --input_list "$OUT/input_list.txt"             --output_dir "$OUT/qnn-cpu"             --use_native_input_files             --use_native_output_files
          python - <<'PY'
          import numpy as np, pathlib, torch
          root=pathlib.Path("build/breeze-qnn/qnn-cpu")
          raws=list(root.rglob("*.raw"))
          if not raws: raise SystemExit("QNN CPU produced no raw output")
          ref=torch.load("build/breeze-qnn/breeze_vocoder_64.reference.pt",map_location="cpu")["audio"].numpy().astype(np.float32).reshape(-1)
          candidates=[]
          for p in raws:
              a=np.fromfile(p,dtype=np.float32)
              if a.size==ref.size: candidates.append((p,a))
          if not candidates: raise SystemExit("QNN CPU output shape did not match PCM reference")
          p,got=candidates[0]
          err=float(np.max(np.abs(got-ref))); mean=float(np.mean(np.abs(got-ref)))
          peak=float(np.max(np.abs(got))); rms=float(np.sqrt(np.mean(got*got)))
          print("QNN CPU",p,"max/mean",err,mean,"peak/rms",peak,rms)
          if not np.isfinite(got).all() or peak<1e-3 or rms<5e-5 or err>0.08 or mean>0.008:
              raise SystemExit("Converted QNN graph failed signal/parity validation")
          PY

      - name: Compile SM8850 HTP context
        shell: bash
        run: |
          set -euxo pipefail
          export LD_LIBRARY_PATH="${QNN_SDK_ROOT}/lib/x86_64-linux-clang:${LD_LIBRARY_PATH:-}"
          OUT="$GITHUB_WORKSPACE/build/breeze-qnn"
          mkdir -p "$OUT/contexts/sm8850"
          qnn-context-binary-generator             --backend "${QNN_SDK_ROOT}/lib/x86_64-linux-clang/libQnnHtp.so"             --model "$OUT/model_lib/x86_64-linux-clang/libbreeze_vocoder_64.so"             --htp_socs sm8850             --binary_file breeze-vocoder-sm8850-feature64-fp16             --output_dir "$OUT/contexts/sm8850"             --log_level info
          file="$(find "$OUT/contexts/sm8850" -maxdepth 1 -type f -name 'breeze-vocoder-sm8850-feature64-fp16.*' -print -quit)"
          test -n "$file"; test -s "$file"
          mv "$file" "$OUT/contexts/breeze-vocoder-sm8850-feature64-fp16.bin"
          rm -rf "$OUT/contexts/sm8850"
          cp "$OUT/breeze_quantizer_lut_fp32.bin" "$OUT/contexts/breeze-quantizer-lut-fp32.bin"

      - name: Build manifest and licensing
        shell: bash
        run: |
          set -euxo pipefail
          OUT=build/breeze-qnn/contexts
          cp "${RUNNER_TEMP}/breeze/LICENSE" "$OUT/LICENSE-Breeze-TTS-2.txt"
          cat > "$OUT/NOTICE-Breeze-QNN-Vocoder.txt" <<'EOF'
          Breeze TTS 2 is licensed under the BreezeBlue Research and Non-Commercial
          License Agreement. Copyright (c) 2026 RESONIA, INC. All Rights Reserved.
          Modification: the released decoder is converted to an SM8850 QAIRT/QNN
          HTP context. The residual-vector-quantizer rows are preprojected into an
          FP32 lookup table to provide verified FLOAT32 features to QNN.
          EOF
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("build/breeze-qnn/contexts")
          def spec(name):
              d=(root/name).read_bytes()
              return {"file":name,"bytes":len(d),"sha256":hashlib.sha256(d).hexdigest()}
          manifest={
            "version":2,
            "backend":"QAIRT/QNN HTP FP16 feature-input",
            "qnn_version":"2.50.0.260828",
            "frames":64,"left_context_frames":25,"samples_per_frame":1920,
            "sample_rate":24000,"feature_channels":512,
            "source":"BreezeBlue/Breeze-TTS-2 audio_tokenizer",
            "license":"BreezeBlue Research and Non-Commercial License v1.1",
            "files":{"SM8850":{
              "context":spec("breeze-vocoder-sm8850-feature64-fp16.bin"),
              "lut":spec("breeze-quantizer-lut-fp32.bin")
            }}
          }
          (root/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print(json.dumps(manifest,indent=2))
          PY
          (cd "$OUT" && sha256sum *.bin LICENSE-Breeze-TTS-2.txt NOTICE-Breeze-QNN-Vocoder.txt > SHA256SUMS.txt)
          ls -lh "$OUT"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v6
        with:
          name: Breeze-QNN-Vocoder-SM8850-v2
          path: build/breeze-qnn/contexts/*
          retention-days: 14
          if-no-files-found: error

      - name: Publish SM8850 v2 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          if ! gh release view "$VOCODER_RELEASE" >/dev/null 2>&1; then
            gh release create "$VOCODER_RELEASE"               --title "Breeze QNN Vocoder SM8850 v2"               --notes "SM8850-only QAIRT QNN HTP feature-input vocoder. Derived from Breeze TTS 2; research/non-commercial use only."
          fi
          gh release upload "$VOCODER_RELEASE" build/breeze-qnn/contexts/* --clobber
