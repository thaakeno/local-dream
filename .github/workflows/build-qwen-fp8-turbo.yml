# Qwen Image 2.1 FP8 + Viggle Turbo reproducible APK build
name: Build Qwen FP8 Turbo APK

on:
  workflow_dispatch:
  push:
    branches:
      - qwen-fp8-turbo
      - yue2-text-music
      - yue2-fast-instrumental-htp
      - v141-stable-yue2-full
      - breeze-htp-clean-v150
    paths:
      - 'app/**'
      - '.gitmodules'
      - '.github/workflows/build-qwen-fp8-turbo.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  QNN_VERSION: '2.50.0.260828'
  QNN_URL: 'https://apigwx-aws.qualcomm.com/qsc/public/v1/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/2.50.0.260828/v2.50.0.260828.zip'
  BUILD_GIT_SHA: ${{ github.sha }}
  BUILD_GIT_BRANCH: ${{ github.ref_name }}
  BUILD_REPOSITORY: ${{ github.repository }}
  BUILD_UPSTREAM_REPOSITORY: 'xororz/local-dream'
  BUILD_IS_FORK: 'true'
  BREEZE_NATIVE_BASE_SHA: '70a473e5ed09c1988eda2421ce604032727f3b7d'
  BREEZE_NATIVE_BASE_CACHE_KEY: 'localdream-native-b0b0a31bb69f8750f08e0ceabd686873bac5bec8b7328afef3b26faf4b08c27a'

permissions:
  contents: read
  actions: write

concurrency:
  group: qwen-fp8-turbo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 1

      - name: Initialize required submodules
        shell: bash
        run: |
          set -euxo pipefail
          git submodule update --init --depth 1 \
            app/src/main/cpp/3rdparty/MNN \
            app/src/main/cpp/3rdparty/cpp-httplib \
            app/src/main/cpp/3rdparty/json \
            app/src/main/cpp/3rdparty/stable-diffusion.cpp \
            app/src/main/cpp/3rdparty/stb \
            app/src/main/cpp/3rdparty/tokenizers-cpp \
            app/src/main/cpp/3rdparty/xsimd \
            app/src/main/cpp/3rdparty/xtensor \
            app/src/main/cpp/3rdparty/xtensor-blas \
            app/src/main/cpp/3rdparty/xtl \
            app/src/main/cpp/3rdparty/zstd \
            app/src/main/cpp/3rdparty/yue2.cpp
          git -C app/src/main/cpp/3rdparty/stable-diffusion.cpp submodule update --init --depth 1 ggml
          git -C app/src/main/cpp/3rdparty/yue2.cpp submodule update --init --depth 1 vendor/cpp-httplib
          git -C app/src/main/cpp/3rdparty/tokenizers-cpp submodule update --init --depth 1 msgpack sentencepiece

      - name: Compute native cache key
        id: native-key
        shell: bash
        run: |
          set -euxo pipefail
          native_key="$(
            {
              git rev-parse HEAD:app/src/main/cpp
              git rev-parse HEAD:app/src/main/rust/xet_downloader
              git submodule status --recursive app/src/main/cpp
              printf '%s\n' "qnn=$QNN_VERSION" "toolchain=arm64-android-v0.7"
            } | sha256sum | awk '{print $1}'
          )"
          echo "key=localdream-native-$native_key" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager_bin="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -perm -u+x | head -n 1)"
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          # Android 17 / API 37 is currently published on the preview
          # channel. Compose 1.12 / Material3 1.5 require compileSdk 37.
          "$sdkmanager_bin" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Kotlin compile preflight
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileBasicDebugKotlin

      - name: Cache QAIRT SDK
        id: qnn-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qnn-sdk-${{ env.QNN_VERSION }}
          key: qairt-${{ env.QNN_VERSION }}-linux-v1

      - name: Download QAIRT SDK
        if: steps.qnn-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          install_dir="${RUNNER_TEMP}/qnn-sdk-${QNN_VERSION}"
          zip_path="${RUNNER_TEMP}/qnn-sdk.zip"
          mkdir -p "$install_dir"
          curl -fL --retry 5 --retry-delay 2 "$QNN_URL" -o "$zip_path"
          unzip -q "$zip_path" -d "$install_dir"
          rm -f "$zip_path"

      - name: Locate QAIRT SDK
        shell: bash
        run: |
          set -euxo pipefail
          install_dir="${RUNNER_TEMP}/qnn-sdk-${QNN_VERSION}"
          sdk_root=""
          for c in "$install_dir" "$install_dir/qairt" "$install_dir/qairt/$QNN_VERSION"; do
            if [ -d "$c/include/QNN" ] && [ -d "$c/lib/aarch64-android" ]; then
              sdk_root="$(cd "$c" && pwd)"
              break
            fi
          done
          if [ -z "$sdk_root" ]; then
            while IFS= read -r d; do
              if [ -d "$d/include/QNN" ] && [ -d "$d/lib/aarch64-android" ]; then
                sdk_root="$d"
                break
              fi
            done < <(find "$install_dir" -mindepth 1 -maxdepth 3 -type d)
          fi
          test -n "$sdk_root"
          test -f "$sdk_root/lib/aarch64-android/libQnnHtp.so"
          test -f "$sdk_root/lib/aarch64-android/libQnnHtpV81Stub.so"
          echo "QNN_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "QAIRT root: $sdk_root"

      - name: Restore native artifacts
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a
            app/src/main/assets/ditlibs
            app/src/main/assets/yue2libs
            app/src/main/assets/breezelibs
            app/src/main/assets/qnnlibs
            app/src/main/assets/licenses/qnn-${{ env.QNN_VERSION }}
          key: ${{ steps.native-key.outputs.key }}

      # v152 is the last verified full native build before the stateful-vocoder
      # mask fix. For Breeze-only native edits, all Xet/image/DiT/YuE2/QNN
      # artifacts are reusable, so rebuild only voice/build.sh.
      - name: Check Breeze-only native delta
        id: breeze-native-delta
        if: steps.native-cache.outputs.cache-hit != 'true' && github.ref_name == 'v141-stable-yue2-full'
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --no-tags --depth=1 origin "$BREEZE_NATIVE_BASE_SHA"
          if git diff --quiet "$BREEZE_NATIVE_BASE_SHA" HEAD -- \
            app/src/main/cpp \
            app/src/main/rust/xet_downloader \
            ':(exclude)app/src/main/cpp/voice/**'; then
            echo "only=true" >> "$GITHUB_OUTPUT"
          else
            echo "only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap verified v152 native artifacts
        id: breeze-native-bootstrap
        if: steps.native-cache.outputs.cache-hit != 'true' && steps.breeze-native-delta.outputs.only == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a
            app/src/main/assets/ditlibs
            app/src/main/assets/yue2libs
            app/src/main/assets/breezelibs
            app/src/main/assets/qnnlibs
            app/src/main/assets/licenses/qnn-${{ env.QNN_VERSION }}
          key: ${{ env.BREEZE_NATIVE_BASE_CACHE_KEY }}

      # The alpha.58 native cache is the exact same Xet/image/DiT source
      # revision as this YuE2-only change. Reuse those immutable artifacts and
      # rebuild only the music backend when the new full cache key is absent.
      - name: Bootstrap unchanged alpha.58 native artifacts
        id: native-bootstrap
        if: steps.native-cache.outputs.cache-hit != 'true' && github.ref_name != 'v141-stable-yue2-full'
        uses: actions/cache/restore@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a
            app/src/main/assets/ditlibs
            app/src/main/assets/yue2libs
            app/src/main/assets/qnnlibs
            app/src/main/assets/licenses/qnn-${{ env.QNN_VERSION }}
          key: localdream-native-e15a1da9bf69e7fc0e09d91594088a80058e21d5bd74d72fb5a11d630423944f

      - name: Build Android core and Hexagon DiT engine
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          docker pull ghcr.io/snapdragon-toolchain/arm64-android:v0.7
          docker run --rm -i --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$QNN_SDK_ROOT:/qnn:ro" \
            -e REUSE_BREEZE_BASE_NATIVE="${{ steps.breeze-native-bootstrap.outputs.cache-hit }}" \
            -e REUSE_STABLE_NATIVE="${{ steps.native-bootstrap.outputs.cache-hit }}" \
            ghcr.io/snapdragon-toolchain/arm64-android:v0.7 \
            bash -s <<'CONTAINER_SCRIPT'
          set -euxo pipefail

          toolchain_file="$(find /opt /usr/local -path "*/build/cmake/android.toolchain.cmake" -print -quit)"
          test -n "$toolchain_file"
          ndk_root="${toolchain_file%/build/cmake/android.toolchain.cmake}"
          test -d "$ndk_root"

          ninja_bin="$(command -v ninja || true)"
          if [ -z "$ninja_bin" ]; then
            ninja_bin="$(find /opt /usr/local /usr -type f -name ninja -perm -u+x -print -quit)"
          fi
          test -x "$ninja_bin"
          export PATH="$(dirname "$ninja_bin"):$PATH"

          hexagon_root="$(find /opt/hexagon -maxdepth 2 -type d -name "6.6*" -print -quit)"
          test -d "$hexagon_root"

          mkdir -p /data
          rm -rf /data/android-ndk-r28
          ln -s "$ndk_root" /data/android-ndk-r28

          export ANDROID_NDK_ROOT="$ndk_root"
          export QNN_SDK_ROOT=/qnn
          export HEXAGON_SDK_ROOT="$hexagon_root"

          # Rust build scripts and proc-macros execute on the x86_64 Linux host
          # even though the final static library targets Android. The Snapdragon
          # image ships Android clang but no host cc, so install one.
          if ! command -v cc >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config
            rm -rf /var/lib/apt/lists/*
          fi
          command -v cc
          cc --version

          # tokenizers-cpp predates Rust 1.89, where
          # dangerous_implicit_autorefs became deny-by-default. Pin 1.88.
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --profile minimal --default-toolchain 1.88.0
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup target add --toolchain 1.88.0 aarch64-linux-android

          echo "NDK: $ANDROID_NDK_ROOT"
          echo "Ninja: $ninja_bin"
          echo "Hexagon: $HEXAGON_SDK_ROOT"
          cmake --version
          ninja --version
          cargo --version
          rustc --version
          rustup show active-toolchain
          rustup target list --installed --toolchain 1.88.0
          test -f /data/android-ndk-r28/build/cmake/android.toolchain.cmake

          cd /workspace/app/src/main/cpp
          if [ "${REUSE_BREEZE_BASE_NATIVE:-false}" = "true" ]; then
            echo "Reusing verified v152 native artifacts; rebuilding Breeze only."
            test -s /workspace/app/src/main/jniLibs/arm64-v8a/libstable_diffusion_core.so
            test -s /workspace/app/src/main/jniLibs/arm64-v8a/libdit_engine.so
            test -s /workspace/app/src/main/jniLibs/arm64-v8a/liblocaldream_xet.so
            test -s /workspace/app/src/main/jniLibs/arm64-v8a/libyue2_server.so
            test -s /workspace/app/src/main/assets/qnnlibs/libQnnHtp.so
            bash voice/build.sh
          elif [ "${REUSE_STABLE_NATIVE:-false}" = "true" ]; then
            echo "Reusing unchanged alpha.58 Xet/image/DiT native artifacts; rebuilding Breeze and YuE2."
            test -s /workspace/app/src/main/jniLibs/arm64-v8a/libstable_diffusion_core.so
            test -s /workspace/app/src/main/jniLibs/arm64-v8a/libdit_engine.so
            test -s /workspace/app/src/main/jniLibs/arm64-v8a/liblocaldream_xet.so
            # Build the newest/most failure-prone native feature first so CI fails fast.
            bash voice/build.sh
            bash music/build.sh
          else
            # Full cold build when the verified bootstrap cache is unavailable.
            # Build Breeze first so Hexagon integration errors surface immediately.
            bash voice/build.sh
            bash /workspace/app/src/main/rust/xet_downloader/build.sh
            bash build.sh
            bash dit/build.sh
            bash music/build.sh
          fi
          CONTAINER_SCRIPT

      - name: Verify staged native artifacts
        shell: bash
        run: |
          set -euxo pipefail
          test -s app/src/main/jniLibs/arm64-v8a/libstable_diffusion_core.so
          test -s app/src/main/jniLibs/arm64-v8a/libdit_engine.so
          test -s app/src/main/jniLibs/arm64-v8a/libyue2_server.so
          test -s app/src/main/jniLibs/arm64-v8a/libyue2_server_fastrpc.so
          test -s app/src/main/jniLibs/arm64-v8a/libyue2_bench_dspqueue.so
          test -s app/src/main/jniLibs/arm64-v8a/libyue2_bench_fastrpc.so
          test -s app/src/main/jniLibs/arm64-v8a/libbreeze_server.so
          test -s app/src/main/jniLibs/arm64-v8a/libbreeze_selftest.so
          readelf -d app/src/main/jniLibs/arm64-v8a/libbreeze_server.so | tee /tmp/breeze-elf-needed.txt
          readelf -d app/src/main/jniLibs/arm64-v8a/libbreeze_selftest.so | tee /tmp/breeze-selftest-elf-needed.txt
          if grep -Eq 'Shared library: \[libggml(-base|-hexagon)?\.so\]' /tmp/breeze-elf-needed.txt; then
            echo "Breeze APK runtime still has private ggml shared-library dependencies" >&2
            exit 1
          fi
          test -s app/src/main/jniLibs/arm64-v8a/liblocaldream_xet.so
          test -s app/src/main/assets/ditlibs/libggml-htp-v79.so
          test -s app/src/main/assets/ditlibs/libggml-htp-v81.so
          for arch in v79 v81; do
            test -s "app/src/main/assets/yue2libs/libggml-htp-$arch.so"
            test -s "app/src/main/assets/yue2libs/libggml-htp-$arch-dspqueue.so"
            test -s "app/src/main/assets/yue2libs/libggml-htp-$arch-fastrpc.so"
          done
          grep -q 'commit=37f752b77fc4d661e2552128f42cb811d7bdb628' app/src/main/assets/yue2libs/backend-version.txt
          grep -q 'variant=dual-transport-yue2-native-0.7.0' app/src/main/assets/yue2libs/backend-version.txt
          grep -q '^integration=' app/src/main/assets/yue2libs/backend-version.txt
          grep -q 'snake-hvx-fused' app/src/main/assets/yue2libs/backend-version.txt
          grep -q 'sin-hvx' app/src/main/assets/yue2libs/backend-version.txt
          grep -q 'col2im1d-htp' app/src/main/assets/yue2libs/backend-version.txt
          grep -q 'col2im-bias-fused' app/src/main/assets/yue2libs/backend-version.txt
          grep -q 'col2im-channel-blocked' app/src/main/assets/yue2libs/backend-version.txt
          grep -q 'channel-bcast-addmul-hvx' app/src/main/assets/yue2libs/backend-version.txt
          grep -q 'adaptive-binary-vtcm' app/src/main/assets/yue2libs/backend-version.txt
          grep -q 'dpmpp2m-sgm-uniform' app/src/main/assets/yue2libs/backend-version.txt
          grep -q 'htp-kv-window64' app/src/main/assets/yue2libs/backend-version.txt
          grep -q 'vae-cpu-parity-gate' app/src/main/assets/yue2libs/backend-version.txt
          grep -q 'dual-transport-server' app/src/main/assets/yue2libs/backend-version.txt
          grep -q 'dual-transport-bench' app/src/main/assets/yue2libs/backend-version.txt
          grep -q 'strict-accelerator' app/src/main/assets/yue2libs/backend-version.txt
          grep -q 'cpu_fallback=disabled' app/src/main/assets/yue2libs/backend-version.txt
          for arch in v73 v75 v79 v81; do
            test -s "app/src/main/assets/breezelibs/libggml-htp-$arch.so"
          done
          grep -q 'runtime_commit=a0e177f91242ebbd2ea8d61548d742c89e4b9e06' app/src/main/assets/breezelibs/backend-version.txt
          grep -q 'backend_commit=ab9acc4476cfe3add369379a3783fea190505a48' app/src/main/assets/breezelibs/backend-version.txt
          grep -q 'mode=strict-htp-dspqueue' app/src/main/assets/breezelibs/backend-version.txt
          grep -q 'fallback=disabled' app/src/main/assets/breezelibs/backend-version.txt
          grep -q 'integration=pinned-source-overlay' app/src/main/assets/breezelibs/backend-version.txt
          grep -q 'queue=opbatch64x32-depbarrier-switch' app/src/main/assets/breezelibs/backend-version.txt
          grep -q 'v81-opbatch64' app/src/main/assets/breezelibs/backend-version.txt
          grep -q 'v81-data-hazard-barrier-switch' app/src/main/assets/breezelibs/backend-version.txt
          grep -q 'v81-direct-residual-add' app/src/main/assets/breezelibs/backend-version.txt
          grep -q 'v153-host-snapshot-cache' app/src/main/assets/breezelibs/backend-version.txt
          grep -q 'streaming_vocoder=v153-host-snapshot-chunk4-v81-hvx-opbatch64-fused' app/src/main/assets/breezelibs/backend-version.txt
          grep -q 'batch-progress-log' app/src/main/assets/breezelibs/backend-version.txt
          grep -q 'sin-hvx' app/src/main/assets/breezelibs/backend-version.txt
          grep -q 'col2im1d-htp' app/src/main/assets/breezelibs/backend-version.txt
          grep -q 'col2im-bias-fused' app/src/main/assets/breezelibs/backend-version.txt
          grep -q 'channel-bcast-addmul-hvx' app/src/main/assets/breezelibs/backend-version.txt
          grep -q 'snake-hvx-fused' app/src/main/assets/breezelibs/backend-version.txt
          grep -q 'adaptive-binary-vtcm' app/src/main/assets/breezelibs/backend-version.txt
          grep -q 'exact-elu-lowering' app/src/main/assets/breezelibs/backend-version.txt
          grep -q 'transpose-conv-gemm-col2im' app/src/main/assets/breezelibs/backend-version.txt
          test -s app/src/main/assets/qnnlibs/libQnnHtp.so
          find app/src/main/jniLibs/arm64-v8a app/src/main/assets/ditlibs app/src/main/assets/yue2libs app/src/main/assets/breezelibs -maxdepth 1 -type f -ls

      - name: Save native artifacts cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a
            app/src/main/assets/ditlibs
            app/src/main/assets/yue2libs
            app/src/main/assets/breezelibs
            app/src/main/assets/qnnlibs
            app/src/main/assets/licenses/qnn-${{ env.QNN_VERSION }}
          key: ${{ steps.native-key.outputs.key }}

      - name: Restore persistent CI signing key
        id: signing-key-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/localdream-ci.jks
          key: localdream-ci-signing-v1

      - name: Create CI signing key once
        if: steps.signing-key-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/localdream-ci.jks" \
            -storepass android \
            -keypass android \
            -alias localdream \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Local Dream Qwen FP8 CI,O=thaakeno,C=DE"

      - name: Save persistent CI signing key
        if: steps.signing-key-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/localdream-ci.jks
          key: localdream-ci-signing-v1

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleBasicDebug \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/localdream-ci.jks" \
            -PRELEASE_STORE_PASSWORD=android \
            -PRELEASE_KEY_ALIAS=localdream \
            -PRELEASE_KEY_PASSWORD=android
          find app/build/outputs/apk -type f -name '*.apk' -ls

      - name: Inspect APK signer
        shell: bash
        run: |
          set -euxo pipefail
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -n 1)"
          apk="$(find app/build/outputs/apk/basic/debug -type f -name '*.apk' | head -n 1)"
          test -x "$apksigner_bin"
          test -s "$apk"

          actual="$("$apksigner_bin" verify --print-certs "$apk" |             sed -n 's/^.*Signer.*certificate SHA-256 digest: //p' | head -n 1 |             tr -d ':' | tr 'A-F' 'a-f')"
          test -n "$actual"

          if [ "$GITHUB_REF_NAME" = "v141-stable-yue2-full" ]; then
            # v146+ test builds use this branch-local certificate.
            # Keep it exactly so Android accepts in-place updates.
            expected="bff433493c171fcd31e8159ca19e64d938b8d4afe043a07be91fec0ad23f071b"
            echo "required v146+ signer: $expected"
            echo "actual signer:            $actual"
            test "$actual" = "$expected"
          else
            expected="4231f002da1066b9055386ceae442394262070545a7a2202d414c8efba724af7"
            echo "canonical signer: $expected"
            echo "actual signer:    $actual"
            if [ "$actual" != "$expected" ]; then
              echo "::warning::Branch-local CI signer differs from the canonical installed-app signer."
            fi
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: LocalDream-Qwen-FP8-Turbo
          path: app/build/outputs/apk/basic/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Dispatch canonical signer
        if: github.ref_name == 'yue2-text-music'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
