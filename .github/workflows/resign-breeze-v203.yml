name: Re-sign Breeze v203 with stable update key

on:
  workflow_dispatch:
  push:
    branches:
      - v141-stable-yue2-full
    paths:
      - '.github/workflows/resign-breeze-v203.yml'

permissions:
  contents: read
  actions: read

jobs:
  resign:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Restore stable Local Dream signing key
        id: signing-key-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/localdream-ci.jks
          key: localdream-ci-signing-v1

      - name: Require existing stable signer
        shell: bash
        run: |
          set -euxo pipefail
          test "${{ steps.signing-key-cache.outputs.cache-hit }}" = "true"
          test -s "$RUNNER_TEMP/localdream-ci.jks"

      - name: Download v203 APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p incoming
          curl -fL --retry 5 --retry-delay 2             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11480113406/zip"             -o artifact.zip
          unzip -q artifact.zip -d incoming
          apk="$(find incoming -type f -name '*.apk' -print -quit)"
          test -s "$apk"
          cp "$apk" LocalDream_armv8a_3.0.0-alpha.63-v141yue2breeze.58.apk

      - name: Re-sign with installed-app certificate
        shell: bash
        run: |
          set -euxo pipefail
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -n 1)"
          test -x "$apksigner_bin"
          input="LocalDream_armv8a_3.0.0-alpha.63-v141yue2breeze.58.apk"
          output="LocalDream_armv8a_3.0.0-alpha.63-v141yue2breeze.58-stable-signed.apk"
          "$apksigner_bin" sign             --ks "$RUNNER_TEMP/localdream-ci.jks"             --ks-key-alias localdream             --ks-pass pass:android             --key-pass pass:android             --out "$output"             "$input"
          actual="$("$apksigner_bin" verify --print-certs "$output" |             sed -n 's/^.*Signer.*certificate SHA-256 digest: //p' | head -n 1 |             tr -d ':' | tr 'A-F' 'a-f')"
          expected="bff433493c171fcd31e8159ca19e64d938b8d4afe043a07be91fec0ad23f071b"
          echo "expected signer: $expected"
          echo "actual signer:   $actual"
          test "$actual" = "$expected"
          "$apksigner_bin" verify --verbose --print-certs "$output"

      - name: Upload corrected APK
        uses: actions/upload-artifact@v6
        with:
          name: LocalDream-v203-stable-signed
          path: LocalDream_armv8a_3.0.0-alpha.63-v141yue2breeze.58-stable-signed.apk
          if-no-files-found: error
          retention-days: 14
