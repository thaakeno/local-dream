name: Recall D3 Nano fused decoder qualification
on:
  push:
    branches: [recall-d3-nano-qnn]
    paths: [recall-qnn-fused/**, .github/workflows/recall-d3-nano-qnn-fused.yml]
permissions:
  contents: read
concurrency:
  group: recall-d3-nano-qnn-fused
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      HF_HOME: /tmp/recall-d3-hf
      D3_WORK: /tmp/recall-d3-qnn-fused
      QAI_DEVICE: Samsung Galaxy S26 (Family)
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      D3_STABLE_DECAY: 'true'
      D3_SEQUENCE_BUCKET: '384'
      D3_FUSED_BLOCKS: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: recall-qnn-fused
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install cloud-only conversion dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'qai-hub>=0.56.0' 'huggingface-hub>=0.34' safetensors 'numpy<3' 'onnx==1.18.0' 'onnxruntime==1.22.1' 'transformers>=5.0' pillow 'torchvision==0.23.0' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Qualify fused NPU decoder blocks
        env:
          QAI_HUB_API_TOKEN: ${{ secrets.D3_QAI_HUB_API_TOKEN }}
        run: |
          python recall-qnn-fused/test_lowering.py
          python recall-qnn-fused/convert.py
      - name: Preserve numerical qualification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recall-d3-nano-qnn-fused-qualification
          path: |
            /tmp/recall-d3-qnn-fused/report.json
            /tmp/recall-d3-qnn-fused/*.json
          retention-days: 14
