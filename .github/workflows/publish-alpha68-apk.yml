name: Publish alpha.68 direct APK
on:
  push:
    branches:
      - fix/sdxl-efficient-classic-catalog-20261022
    paths:
      - .github/workflows/publish-alpha68-apk.yml
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download permanently signed APK from verified native build
        uses: actions/download-artifact@v4
        with:
          name: LocalDream-Classic-Permanent
          run-id: 39815614646
          github-token: ${{ github.token }}
          path: apk
      - name: Validate APK identity and publish prerelease as raw APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk="apk/LocalDream_armv8a_3.0.0-alpha.68.apk"
          test -s "$apk"
          magic="$(head -c 2 "$apk" | od -An -tx1 | tr -d ' \n')"
          test "$magic" = "504b"
          sha256sum "$apk"
          tag="v3.0.0-alpha.68"
          target="310105c6b5716e9cf4160d410b4d2e00b7aeb91e"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --target "$target" --title "Local Dream 3.0.0-alpha.68 (223)" \
              --notes "Permanently signed alpha.68 APK from verified GitHub Actions run 39815614646. Breeze cloned voice library and experimental MOSS Turbo. Device inference and performance remain experimental. Keep app data backed up." \
              --prerelease
          fi
          echo "Direct file: https://github.com/$GH_REPO/releases/download/$tag/$(basename "$apk")"
