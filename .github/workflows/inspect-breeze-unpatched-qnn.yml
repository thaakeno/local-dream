name: Inspect unpatched Qualcomm SampleApp interfaces

on:
  workflow_dispatch:
  push:
    branches: [breeze-fast20-cleanup-experimental, breeze-qnn-clean-runtime-prototype]
    paths:
      - '.github/workflows/inspect-breeze-unpatched-qnn.yml'
      - 'app/src/main/cpp/include/QnnOwned*.hpp'
      - 'app/src/main/cpp/voice/native/breeze-qnn-*.cpp'
      - 'app/src/main/cpp/src/QnnModel.hpp'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Restore pinned QAIRT tools
        id: sdk
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/qnn-sdk-2.50.0.260828
          key: qairt-2.50.0.260828-linux-v1
      - name: Download QAIRT if not cached
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 5 'https://apigwx-aws.qualcomm.com/qsc/public/v1/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/2.50.0.260828/v2.50.0.260828.zip' -o /tmp/qa.zip
          mkdir -p "$RUNNER_TEMP/qnn-sdk-2.50.0.260828"
          unzip -q /tmp/qa.zip -d "$RUNNER_TEMP/qnn-sdk-2.50.0.260828"
      - name: Inspect public method and field names without publishing SDK source
        shell: bash
        run: |
          set -eu
          sdk_dir="$RUNNER_TEMP/qnn-sdk-2.50.0.260828"
          hdr="$(find "$sdk_dir" -path '*/examples/QNN/SampleApp/SampleApp/src/QnnSampleApp.hpp' -type f -print -quit)"
          cpp="${hdr%.hpp}.cpp"
          io="${hdr%QnnSampleApp.hpp}Utils/IOTensor.hpp"
          test -s "$hdr"
          test -s "$cpp"
          test -s "$io"
          echo '== QnnSampleApp interface declaration symbols =='
          grep -nE '(^ *(private|protected|public):|StatusCode (initialize|initializeBackend|createFromBinary)|QnnFunctionPointers|Qnn_ContextHandle_t|m_graphsInfo|m_ioTensor|m_context|m_deviceHandle|m_backendHandle|m_logHandle|m_profileBackendHandle|m_cachedBinaryPath)' "$hdr" | head -100
          echo '== QnnSampleApp initializer and binary loader called APIs =='
          grep -nE 'QnnSampleApp::initialize|QnnSampleApp::createFromBinary|contextCreateFromBinary|systemContextGetBinaryInfo|logCreate|m_context|m_graphsInfo|m_graphsCount' "$cpp" | head -110
          echo '== IOTensor data conversion declaration symbols =='
          grep -nE '(^ *(private|protected|public):|copyFromFloatToNative|convertToFloat|setupInputAndOutputTensors|tearDownInputAndOutputTensors|copyFromFloat)' "$io" | head -100
          echo '== SDK QNN metadata and lifecycle call names =='
          grep -nE 'copyMetadataToGraphsInfo|systemContextCreate|systemContextFree|backendCreate|deviceCreate|graphRetrieve|contextCreateFromBinary|QNN_TENSOR_SET_CLIENT_BUF|QNN_TENSOR_GET_CLIENT_BUF' "$cpp" | head -110
          echo '== SDK metadata declaration =='
          grep -R -n -m 8 'copyMetadataToGraphsInfo' "$(dirname "$hdr")" | cut -c1-200 | head -35
          echo '== SDK QNN helper prototypes =='
          sed -n '35,75p' "$(dirname "$hdr")/Utils/QnnSampleAppUtils.hpp"
          echo '== SDK tensor IO declarations =='
          sed -n '34,132p' "$io"
          echo '== SDK QNN context metadata APIs =='
          sed -n '430,515p' "$cpp" | grep -E 'QNN_SUCCESS|qnnSystemInterface|contextCreateFromBinary|m_(context|backend|device|graph)|copyMetadata|systemCtx|binaryInfo|binaryInfoSize|m_cachedBinary|bufferSize|status|returnStatus' | head -65
          echo '== SDK float-to-TFN API signatures =='
          grep -n 'floatToTfN' "$(dirname "$hdr")/Utils/DataUtil.hpp" | head -15
          echo '== QNN tensor allocation symbols and relevant source window =='
          iocpp="${io%.hpp}.cpp"
          grep -nE 'setupInputAndOutputTensors|setupTensors|setupTensor|deepCopy|allocateBuffer|FLOAT_16|UINT_16|UFIXED_POINT_16|tearDownInputAndOutputTensors' "$iocpp" | head -130
          sed -n '380,570p' "$iocpp"
          echo '== QNN tensor allocation declarations =='
          sed -n '35,115p' "$io"
          echo '== Local Dream owned runtime C++ syntax test =='
          sdk_src="$(find "$sdk_dir" -path '*/examples/QNN/SampleApp/SampleApp/src/QnnSampleApp.hpp' -type f -print -quit)"
          sdk_src="${sdk_src%/QnnSampleApp.hpp}"
          sdk_root="${sdk_src%/examples/QNN/SampleApp/SampleApp/src}"
          c++ -std=c++17 -fsyntax-only -Wall -Wextra -Wno-unused-parameter -x c++ - \
            -I app/src/main/cpp/include \
            -I "$sdk_root/include/QNN" \
            -I "$sdk_src" \
            -I "$sdk_src/Utils" \
            -I "$sdk_src/WrapperUtils" \
            -I "$sdk_src/Log" \
            -I "$sdk_src/PAL/include" <<'HEADER_EOF'
          #include "QnnOwnedRuntime.hpp"
          class TestRuntime final : public QnnOwnedRuntime {
          public:
              using QnnOwnedRuntime::QnnOwnedRuntime;
          };
          static_assert(sizeof(TestRuntime) > 0, "owned QNN runtime compiles");
          HEADER_EOF
          echo 'Owned QNN runtime and typed I/O C++ syntax OK'
          echo '== Streaming vocoder waveform quality gate tests =='
          c++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -I app/src/main/cpp/voice/overlay/breeze/include \
            tools/breeze_qnn/test_vocoder_quality_gate.cpp -o /tmp/vocoder_quality_gate
          /tmp/vocoder_quality_gate
          echo 'QAIRT audit finished (member signatures only).'
      - name: Save SDK cache for later no-patch compilation
        if: steps.sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/qnn-sdk-2.50.0.260828
          key: qairt-2.50.0.260828-linux-v1
