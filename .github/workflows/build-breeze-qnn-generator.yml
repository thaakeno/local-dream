name: Build Breeze QNN Full Generator

on:
  workflow_dispatch:
  push:
    branches:
      - v141-stable-yue2-full
    paths:
      - 'tools/breeze_qnn/export_generator_full_onnx.py'
      - '.github/workflows/build-breeze-qnn-generator.yml'

permissions:
  contents: write

concurrency:
  group: breeze-qnn-generator-sm8850-v2
  cancel-in-progress: true

env:
  RELEASE_TAG: breeze-qnn-generator-sm8850-v2
  QAI_DEVICE: Samsung Galaxy S26 (Family)
  HF_XET_HIGH_PERFORMANCE: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Free runner disk
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android/sdk/ndk /opt/ghc /usr/share/dotnet || true
          df -h /

      - name: Install exporter and AI Hub client
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.7.1'
          python -m pip install \
            'transformers==4.57.3' 'huggingface_hub>=0.36.0' 'hf_xet>=1.1.10' \
            'safetensors>=0.5.3' 'onnx==1.18.0' 'onnxscript>=0.3.2' \
            'numpy==1.26.4' 'accelerate>=1.12.0' 'qai-hub>=0.56.0'
          git clone --depth 1 https://github.com/breezeblue-ai/breeze-tts.git "${RUNNER_TEMP}/breeze-src"

      - name: Export full native-sampling generator
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/breeze-qnn-generator
          python tools/breeze_qnn/export_generator_full_onnx.py \
            --source-dir "${RUNNER_TEMP}/breeze-src" \
            --cache-dir "${RUNNER_TEMP}/hf-cache" \
            --output-dir build/breeze-qnn-generator
          for f in \
            breeze_depth_prefill.onnx breeze_depth_step.onnx \
            breeze_backbone_prefill.onnx breeze_backbone_step.onnx; do
            test -s "build/breeze-qnn-generator/$f"
          done
          cat build/breeze-qnn-generator/generator-export.json
          df -h /

      - name: Compile and link full generator on Qualcomm AI Hub
        shell: bash
        env:
          QAI_HUB_API_TOKEN: ${{ secrets.QAI_HUB_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${QAI_HUB_API_TOKEN:-}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import qai_hub as hub

          root = Path("build/breeze-qnn-generator")
          client = hub.Client(hub.ClientConfig(api_token=os.environ["QAI_HUB_API_TOKEN"]))
          device = hub.Device(os.environ["QAI_DEVICE"])
          fp16 = "--qnn_options default_graph_htp_precision=FLOAT16"

          # Use the same pattern Qualcomm uses for LLMs: one prompt graph
          # plus one autoregressive graph per context. The previous 4/6-graph
          # helper jobs were failing during context-binary finalization.
          #
          # Depth always uses physical batch-2. Non-CFG duplicates the branch;
          # CFG uses cond/uncond. This avoids linking duplicate batch variants.
          dpre = str(root / "breeze_depth_prefill.onnx")
          dstep = str(root / "breeze_depth_step.onnx")
          depth_models = [dpre, dstep]
          depth_specs = [
              {
                  "backbone_hidden": ((2, 2048), "float16"),
                  "first_codebook": ((2,), "int32"),
              },
              {
                  "token": ((2,), "int32"),
                  "position": ((1,), "int32"),
                  "key_cache": ((2, 24, 16, 128), "float16"),
                  "value_cache": ((2, 24, 16, 128), "float16"),
              },
          ]
          depth_names = ["depth_prefill_b2", "depth_step_b2"]
          depth_jobs, depth_link = client.submit_compile_and_link_jobs(
              models=depth_models,
              input_specs=depth_specs,
              device=device,
              name="Breeze TTS 2 depth AR pair SM8850",
              graph_names=depth_names,
              compile_options=[fp16, fp16],
              link_options="--qnn_options default_graph_htp_optimizations=O=3",
          )
          if depth_link is None:
              raise SystemExit("AI Hub did not create the depth link job")
          for job in depth_jobs:
              status = job.wait()
              if not status.success:
                  raise SystemExit(
                      f"AI Hub depth compile {job.job_id} failed: "
                      f"{status.message or status.code} {job.url}"
                  )
          depth_status = depth_link.wait()
          if not depth_status.success:
              raise SystemExit(
                  "AI Hub depth link failed: " +
                  (depth_status.message or depth_status.code) +
                  " " + depth_link.url
              )
          depth_target = root / "breeze-depth-sm8850-v81.bin"
          if not depth_link.download_target_model(str(depth_target)):
              raise SystemExit("AI Hub depth QNN target download failed")

          # Backbone mirrors Qualcomm's LLM prompt/token layout: one fixed
          # 512-token prompt processor + one batch-2 AR1 token generator.
          # Cond/uncond prefills run separately through the same prompt graph,
          # then share the physical batch-2 token graph.
          bpre = str(root / "breeze_backbone_prefill.onnx")
          bstep = str(root / "breeze_backbone_step.onnx")
          backbone_models = [bpre, bstep]
          backbone_specs = [
              {
                  "inputs_embeds": ((1, 512, 2048), "float16"),
                  "attention_mask": ((1, 1, 512, 512), "float16"),
                  "positions": ((1, 512), "int32"),
              },
              {
                  "input_embed": ((2, 1, 2048), "float16"),
                  "positions": ((2,), "int32"),
                  "key_cache": ((2, 224, 512, 128), "float16"),
                  "value_cache": ((2, 224, 512, 128), "float16"),
                  "attention_mask": ((2, 1, 1, 513), "float16"),
              },
          ]
          backbone_names = ["backbone_prefill_512", "backbone_step_b2"]
          backbone_jobs, backbone_link = client.submit_compile_and_link_jobs(
              models=backbone_models,
              input_specs=backbone_specs,
              device=device,
              name="Breeze TTS 2 backbone prompt+AR1 SM8850",
              graph_names=backbone_names,
              compile_options=[fp16, fp16],
              link_options="--qnn_options default_graph_htp_optimizations=O=3",
          )
          if backbone_link is None:
              raise SystemExit("AI Hub did not create the backbone link job")
          for job in backbone_jobs:
              status = job.wait()
              if not status.success:
                  raise SystemExit(
                      f"AI Hub backbone compile {job.job_id} failed: "
                      f"{status.message or status.code} {job.url}"
                  )
          backbone_status = backbone_link.wait()
          if not backbone_status.success:
              raise SystemExit(
                  "AI Hub backbone link failed: " +
                  (backbone_status.message or backbone_status.code) +
                  " " + backbone_link.url
              )
          backbone_target = root / "breeze-backbone-sm8850-v81.bin"
          if not backbone_link.download_target_model(str(backbone_target)):
              raise SystemExit("AI Hub backbone QNN target download failed")

          for p in (depth_target, backbone_target):
              if not p.is_file() or p.stat().st_size < 1_000_000:
                  raise SystemExit(f"Downloaded QNN context missing or too small: {p}")

          meta = {
              "device": os.environ["QAI_DEVICE"],
              "depth_compile_jobs": [j.job_id for j in depth_jobs],
              "depth_link_job": depth_link.job_id,
              "depth_context_bytes": depth_target.stat().st_size,
              "depth_graph_names": depth_names,
              "backbone_compile_jobs": [j.job_id for j in backbone_jobs],
              "backbone_link_job": backbone_link.job_id,
              "backbone_context_bytes": backbone_target.stat().st_size,
              "backbone_graph_names": backbone_names,
              "backbone_prefill_buckets": [512],
          }
          (root / "qai-hub-job.json").write_text(json.dumps(meta, indent=2) + "\n")
          print(json.dumps(meta, indent=2))
          PY

      - name: Split release assets and build manifest
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("build/breeze-qnn-generator")
          release = root / "release"
          release.mkdir(exist_ok=True)
          export = json.loads((root / "generator-export.json").read_text())
          hub = json.loads((root / "qai-hub-job.json").read_text())
          chunk_size = 1900 * 1024 * 1024

          def split_context(source_name: str, prefix: str):
              source = root / source_name
              whole = hashlib.sha256()
              parts = []
              total = 0
              with source.open("rb") as src:
                  index = 0
                  while True:
                      data = src.read(chunk_size)
                      if not data:
                          break
                      index += 1
                      name = f"{prefix}.part{index:02d}.bin"
                      (release / name).write_bytes(data)
                      sha = hashlib.sha256(data).hexdigest()
                      whole.update(data)
                      total += len(data)
                      parts.append({"file": name, "bytes": len(data), "sha256": sha})
              if total != source.stat().st_size:
                  raise SystemExit(f"Context split mismatch for {source_name}")
              return {"bytes": total, "sha256": whole.hexdigest(), "parts": parts}

          depth = split_context(
              "breeze-depth-sm8850-v81.bin",
              "breeze-depth-sm8850-v81",
          )
          backbone = split_context(
              "breeze-backbone-sm8850-v81.bin",
              "breeze-backbone-sm8850-v81",
          )
          manifest = {
              "version": 2,
              "engine": export["engine"],
              "backend": "Qualcomm AI Hub QAIRT/QNN HTP",
              "source": "BreezeBlue/Breeze-TTS-2",
              "target_device": hub["device"],
              "soc_model": 87,
              "htp_arch": "V81",
              "depth_graph_names": hub["depth_graph_names"],
              "backbone_graph_names": hub["backbone_graph_names"],
              "backbone_prefill_buckets": hub["backbone_prefill_buckets"],
              "backbone_max_seq": export["backbone"]["max_seq"],
              "files": {
                  "SM8850": {
                      "depth_context": depth,
                      "backbone_context": backbone,
                  }
              },
          }
          (release / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY
          cp "${RUNNER_TEMP}/breeze-src/LICENSE" build/breeze-qnn-generator/release/LICENSE-Breeze-TTS-2.txt
          cat > build/breeze-qnn-generator/release/NOTICE-Breeze-QNN-Generator.txt <<'EOF'
          Breeze TTS 2 is licensed under the BreezeBlue Research and Non-Commercial
          License Agreement. This release contains SM8850/V81 QNN HTP contexts for
          both the Qwen3 backbone and residual depth decoder. Each context uses
          Qualcomm's prompt-plus-AR graph pattern with physical batch-2 AR decode.
          Sampling stays native; unsupported inputs retain ggml-Hexagon fallback.
          EOF
          (cd build/breeze-qnn-generator/release && sha256sum * > SHA256SUMS.txt)
          ls -lh build/breeze-qnn-generator/release

      - name: Upload CI artifact
        uses: actions/upload-artifact@v6
        with:
          name: Breeze-QNN-Full-Generator-SM8850-v2
          path: build/breeze-qnn-generator/release/*
          retention-days: 14
          if-no-files-found: error

      - name: Publish full QNN generator release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Breeze Full QNN Generator SM8850 v2" \
              --notes "Experimental SM8850/V81 full QNN generator: Qwen3 backbone + depth decoder, batch-1 and CFG batch-2. GGML/Hexagon fallback remains available. Breeze license applies."
          fi
          gh release upload "$RELEASE_TAG" build/breeze-qnn-generator/release/* --clobber
