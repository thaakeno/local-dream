name: Build Breeze QNN Full Generator

on:
  workflow_dispatch:
  push:
    branches:
      - v141-stable-yue2-full
    paths:
      - '.github/workflows/build-breeze-qnn-generator.yml'

permissions:
  contents: write

concurrency:
  group: breeze-qnn-generator-sm8850-v3
  cancel-in-progress: true

env:
  RELEASE_TAG: breeze-qnn-generator-sm8850-v3
  QAI_DEVICE: Samsung Galaxy S26 (Family)
  QNN_VERSION: '2.50.0.260828'
  QNN_URL: 'https://apigwx-aws.qualcomm.com/qsc/public/v1/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/2.50.0.260828/v2.50.0.260828.zip'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache QAIRT SDK
        id: qnn-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qnn-sdk-${{ env.QNN_VERSION }}
          key: qairt-${{ env.QNN_VERSION }}-linux-v1

      - name: Download QAIRT SDK
        if: steps.qnn-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          install_dir="${RUNNER_TEMP}/qnn-sdk-${QNN_VERSION}"
          zip_path="${RUNNER_TEMP}/qnn-sdk.zip"
          mkdir -p "$install_dir"
          curl -fL --retry 5 --retry-delay 2 "$QNN_URL" -o "$zip_path"
          unzip -q "$zip_path" -d "$install_dir"
          rm -f "$zip_path"

      - name: Locate QAIRT SDK
        shell: bash
        run: |
          set -euxo pipefail
          install_dir="${RUNNER_TEMP}/qnn-sdk-${QNN_VERSION}"
          sdk_root=""
          while IFS= read -r d; do
            if [ -d "$d/include/QNN" ] && [ -x "$d/bin/x86_64-linux-clang/qnn-context-binary-generator" ]; then
              sdk_root="$d"
              break
            fi
          done < <(find "$install_dir" -maxdepth 4 -type d)
          test -n "$sdk_root"
          test -s "$sdk_root/lib/x86_64-linux-clang/libQnnModelDlc.so"
          test -s "$sdk_root/lib/x86_64-linux-clang/libQnnHtp.so"
          test -s "$sdk_root/lib/x86_64-linux-clang/libHtpPrepare.so"
          test -s "$sdk_root/lib/x86_64-linux-clang/libQnnHtpNetRunExtensions.so"
          echo "QNN_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "QAIRT_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/bin/x86_64-linux-clang" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$sdk_root/lib/x86_64-linux-clang:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Install host tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libc++1 libc++abi1
          sudo rm -rf /usr/local/lib/android/sdk/ndk /opt/ghc /usr/share/dotnet || true
          python -m pip install --upgrade pip
          python -m pip install 'qai-hub>=0.56.0'
          git clone --depth 1 https://github.com/qualcomm/qai-appbuilder.git "${RUNNER_TEMP}/qai-appbuilder"
          req="${QNN_SDK_ROOT}/bin/requirements.txt"
          if [ -f "$req" ]; then python -m pip install -r "$req"; fi
          df -h /

      - name: Download already-compiled QNN DLCs
        shell: bash
        env:
          QAI_HUB_API_TOKEN: ${{ secrets.QAI_HUB_API_TOKEN }}
        run: |
          set -euxo pipefail
          test -n "${QAI_HUB_API_TOKEN:-}"
          mkdir -p build/breeze-qnn-generator
          python - <<'PY'
          import json, os
          from pathlib import Path
          import qai_hub as hub

          root = Path("build/breeze-qnn-generator")
          client = hub.Client(hub.ClientConfig(api_token=os.environ["QAI_HUB_API_TOKEN"]))

          # These four jobs all completed successfully in run #15. Reuse them
          # verbatim; do not re-export or recompile anything on AI Hub.
          jobs = {
              "depth_prefill": ("jgodnv9x5", "depth_prefill_b2", "breeze-depth-prefill-sm8850-v81.dlc"),
              "depth_step": ("jp1ow8k25", "depth_step_b2", "breeze-depth-step-sm8850-v81.dlc"),
              "backbone_prefill": ("jgn1m92rp", "backbone_prefill_512", "breeze-backbone-prefill-sm8850-v81.dlc"),
              "backbone_step": ("jpy8jnxrg", "backbone_step_b2", "breeze-backbone-step-sm8850-v81.dlc"),
          }

          result = {}
          for key, (job_id, graph, filename) in jobs.items():
              job = client.get_job(job_id)
              status = job.get_status()
              if not status.success:
                  raise SystemExit(f"cached AI Hub job {job_id} is no longer successful: {status}")
              target = job.get_target_model()
              if target is None:
                  raise SystemExit(f"cached AI Hub job {job_id} has no target model")
              path = root / filename
              target.download(str(path))
              if not path.is_file() or path.stat().st_size < 100_000:
                  raise SystemExit(f"bad DLC download: {path}")
              result[key] = {
                  "graph": graph,
                  "compile_job": job_id,
                  "compile_url": job.url,
                  "dlc_bytes": path.stat().st_size,
                  "runtime": "qnn_dlc",
                  "reused": True,
              }
              print(key, path.stat().st_size, job.url)

          (root / "qai-hub-job.json").write_text(json.dumps({
              "device": os.environ.get("QAI_DEVICE", "Samsung Galaxy S26 (Family)"),
              "contexts": result,
          }, indent=2) + "\n")
          PY
          ls -lh build/breeze-qnn-generator/*.dlc
          df -h /

      - name: Convert DLCs to native SM8850 V81 contexts
        shell: bash
        run: |
          set -uo pipefail
          export QAIRT_SDK_ROOT="$QNN_SDK_ROOT"
          export LD_LIBRARY_PATH="$QNN_SDK_ROOT/lib/x86_64-linux-clang:${LD_LIBRARY_PATH:-}"
          ROOT="$GITHUB_WORKSPACE/build/breeze-qnn-generator"
          TOOL="${RUNNER_TEMP}/qai-appbuilder/tools/skills/qai-runner-skill/scripts/qai_dev_gen_contextbin_x86.py"
          test -s "$TOOL" || exit 1

          # QAIRT 2.50's O=3 finalize path hits fp16_conv_activations with
          # "bias dim 256 / scale dim 128" on Breeze depth-prefill. Qualcomm
          # documents O as the HTP graph optimization level, so generate the
          # exact same SM8850/V81 context while progressively disabling the
          # aggressive finalizer. No AI Hub recompilation is needed.
          convert_one() {
            local dlc="$1"
            local out="$2"
            local ok=0

            rm -f "$ROOT/$out" "$ROOT/$out.info.json"
            for opt in 0 1 2 3; do
              echo "=== context generation: $dlc O=$opt ==="
              rm -rf output
              rm -f "$ROOT/htp_config_v81.json" "$ROOT/backend_extensions.json"

              set +e
              python "$TOOL"                 --dlc "$ROOT/$dlc"                 --output "$ROOT/$out"                 --backend htp                 --soc_model 87                 --dsp_arch v81                 --vtcm_mb 8                 --opt_level "$opt"                 --pd_session unsigned                 >"$ROOT/$out.O$opt.log" 2>&1
              rc=$?
              set -e

              cat "$ROOT/$out.O$opt.log"
              if [ "$rc" -eq 0 ] && [ -s "$ROOT/$out" ]; then
                echo "context generation succeeded with O=$opt"
                echo "$opt" > "$ROOT/$out.optlevel"
                ok=1
                break
              fi

              rm -f "$ROOT/$out"
            done

            if [ "$ok" -ne 1 ]; then
              echo "All HTP optimization levels failed for $dlc" >&2
              return 1
            fi

            qnn-context-binary-utility               --context_binary "$ROOT/$out"               --json_file "$ROOT/$out.info.json"

            python - "$ROOT/$out.info.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1]))
          info=data["info"]
          soc=int(info["socModel"])
          arch=int(info["contextMetadata"]["info"]["dspArch"])
          if soc != 87 or arch != 81:
              raise SystemExit(f"wrong native target: soc={soc} arch={arch}")
          graphs=info.get("graphs", [])
          if len(graphs) != 1:
              raise SystemExit(f"expected one graph in context, found {len(graphs)}")
          print("validated native SM8850/V81 context", "soc", soc, "arch", arch)
          PY
          }

          set -e
          convert_one breeze-depth-prefill-sm8850-v81.dlc breeze-depth-prefill-sm8850-v81.bin
          convert_one breeze-depth-step-sm8850-v81.dlc breeze-depth-step-sm8850-v81.bin
          convert_one breeze-backbone-prefill-sm8850-v81.dlc breeze-backbone-prefill-sm8850-v81.bin
          convert_one breeze-backbone-step-sm8850-v81.dlc breeze-backbone-step-sm8850-v81.bin

          ls -lh "$ROOT"/*.bin "$ROOT"/*.optlevel
          df -h /

      - name: Split release assets and build manifest
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path("build/breeze-qnn-generator")
          release = root / "release"
          release.mkdir(exist_ok=True)
          hub = json.loads((root / "qai-hub-job.json").read_text())
          chunk_size = 1900 * 1024 * 1024

          def split_context(source_name: str, prefix: str):
              source = root / source_name
              whole = hashlib.sha256()
              parts = []
              total = 0
              with source.open("rb") as src:
                  index = 0
                  while True:
                      data = src.read(chunk_size)
                      if not data:
                          break
                      index += 1
                      name = f"{prefix}.part{index:02d}.bin"
                      (release / name).write_bytes(data)
                      sha = hashlib.sha256(data).hexdigest()
                      whole.update(data)
                      total += len(data)
                      parts.append({"file": name, "bytes": len(data), "sha256": sha})
              if total != source.stat().st_size:
                  raise SystemExit(f"Context split mismatch for {source_name}")
              opt = int((root / f"{source_name}.optlevel").read_text().strip())
              return {
                  "bytes": total,
                  "sha256": whole.hexdigest(),
                  "htp_optimization_level": opt,
                  "parts": parts,
              }

          contexts = {
              "depth_prefill": split_context("breeze-depth-prefill-sm8850-v81.bin", "breeze-depth-prefill-sm8850-v81"),
              "depth_step": split_context("breeze-depth-step-sm8850-v81.bin", "breeze-depth-step-sm8850-v81"),
              "backbone_prefill": split_context("breeze-backbone-prefill-sm8850-v81.bin", "breeze-backbone-prefill-sm8850-v81"),
              "backbone_step": split_context("breeze-backbone-step-sm8850-v81.bin", "breeze-backbone-step-sm8850-v81"),
          }

          manifest = {
              "version": 3,
              "engine": "qnn-full-generator-separate-v3",
              "backend": "Qualcomm AI Hub QNN DLC + QAIRT HTP offline prepare",
              "source": "BreezeBlue/Breeze-TTS-2",
              "target_device": hub["device"],
              "soc_model": 87,
              "htp_arch": "V81",
              "backbone_max_seq": 512,
              "graphs": {
                  "depth_prefill": "depth_prefill_b2",
                  "depth_step": "depth_step_b2",
                  "backbone_prefill": "backbone_prefill_512",
                  "backbone_step": "backbone_step_b2",
              },
              "jobs": hub["contexts"],
              "files": {"SM8850": contexts},
          }
          (release / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY
          curl -fL --retry 3 https://raw.githubusercontent.com/breezeblue-ai/breeze-tts/main/LICENSE             -o build/breeze-qnn-generator/release/LICENSE-Breeze-TTS-2.txt
          cat > build/breeze-qnn-generator/release/NOTICE-Breeze-QNN-Generator.txt <<'EOF'
          Breeze TTS 2 is licensed under the BreezeBlue Research and Non-Commercial
          License Agreement. These SM8850/V81 contexts reuse the already-successful
          Qualcomm AI Hub QNN DLC compile jobs and are prepared locally with QAIRT.
          EOF
          (cd build/breeze-qnn-generator/release && sha256sum * > SHA256SUMS.txt)
          ls -lh build/breeze-qnn-generator/release

      - name: Upload CI artifact
        uses: actions/upload-artifact@v6
        with:
          name: Breeze-QNN-Full-Generator-SM8850-v3
          path: build/breeze-qnn-generator/release/*
          retention-days: 14
          if-no-files-found: error

      - name: Publish full QNN generator release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG"               --title "Breeze Full QNN Generator SM8850 v3"               --notes "SM8850/V81 full QNN generator. Reuses successful AI Hub DLC compile jobs and performs QAIRT HTP offline preparation with the least aggressive successful graph optimization level."
          fi
          gh release upload "$RELEASE_TAG" build/breeze-qnn-generator/release/* --clobber
