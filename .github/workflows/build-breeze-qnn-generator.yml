name: Build Breeze QNN Full Generator

on:
  workflow_dispatch:
  push:
    branches:
      - v141-stable-yue2-full
    paths:
      - '.github/workflows/build-breeze-qnn-generator.yml'

permissions:
  contents: write

concurrency:
  group: breeze-qnn-generator-sm8850-v4
  cancel-in-progress: true

env:
  RELEASE_TAG: breeze-qnn-generator-sm8850-v4
  QAI_DEVICE: Samsung Galaxy S26 (Family)
  QNN_VERSION: '2.50.0.260828'
  QNN_URL: 'https://apigwx-aws.qualcomm.com/qsc/public/v1/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/2.50.0.260828/v2.50.0.260828.zip'
  DEPTH_V1_URL: 'https://github.com/thaakeno/local-dream/releases/download/breeze-qnn-generator-sm8850-v1/breeze-generator-sm8850-v81.part01.bin'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache QAIRT SDK
        id: qnn-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qnn-sdk-${{ env.QNN_VERSION }}
          key: qairt-${{ env.QNN_VERSION }}-linux-v1

      - name: Download QAIRT SDK
        if: steps.qnn-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          install_dir="${RUNNER_TEMP}/qnn-sdk-${QNN_VERSION}"
          zip_path="${RUNNER_TEMP}/qnn-sdk.zip"
          mkdir -p "$install_dir"
          curl -fL --retry 5 --retry-delay 2 "$QNN_URL" -o "$zip_path"
          unzip -q "$zip_path" -d "$install_dir"
          rm -f "$zip_path"

      - name: Locate QAIRT SDK
        shell: bash
        run: |
          set -euxo pipefail
          install_dir="${RUNNER_TEMP}/qnn-sdk-${QNN_VERSION}"
          sdk_root=""
          while IFS= read -r d; do
            if [ -d "$d/include/QNN" ] && [ -x "$d/bin/x86_64-linux-clang/qnn-context-binary-generator" ]; then
              sdk_root="$d"
              break
            fi
          done < <(find "$install_dir" -maxdepth 4 -type d)
          test -n "$sdk_root"
          test -s "$sdk_root/lib/x86_64-linux-clang/libQnnModelDlc.so"
          test -s "$sdk_root/lib/x86_64-linux-clang/libQnnHtp.so"
          test -s "$sdk_root/lib/x86_64-linux-clang/libHtpPrepare.so"
          test -s "$sdk_root/lib/x86_64-linux-clang/libQnnHtpNetRunExtensions.so"
          echo "QNN_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "QAIRT_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/bin/x86_64-linux-clang" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$sdk_root/lib/x86_64-linux-clang:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Install host tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libc++1 libc++abi1
          sudo rm -rf /usr/local/lib/android/sdk/ndk /opt/ghc /usr/share/dotnet || true
          python -m pip install --upgrade pip
          python -m pip install 'qai-hub>=0.56.0'
          git clone --depth 1 https://github.com/qualcomm/qai-appbuilder.git "${RUNNER_TEMP}/qai-appbuilder"
          req="${QNN_SDK_ROOT}/bin/requirements.txt"
          if [ -f "$req" ]; then python -m pip install -r "$req"; fi
          df -h /

      - name: Reuse proven depth context and compiled backbone DLCs
        shell: bash
        env:
          QAI_HUB_API_TOKEN: ${{ secrets.QAI_HUB_API_TOKEN }}
        run: |
          set -euxo pipefail
          test -n "${QAI_HUB_API_TOKEN:-}"
          ROOT="$GITHUB_WORKSPACE/build/breeze-qnn-generator"
          mkdir -p "$ROOT"

          # Run #3 already produced and published this exact SM8850/V81 batch-1
          # depth context. Do not rebuild the broken batch-2 variant.
          curl -fL --retry 5 --retry-delay 2 "$DEPTH_V1_URL"             -o "$ROOT/breeze-depth-sm8850-v81.bin"
          test "$(stat -c%s "$ROOT/breeze-depth-sm8850-v81.bin")" = "1011101696"

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import qai_hub as hub

          root = Path("build/breeze-qnn-generator")
          client = hub.Client(hub.ClientConfig(api_token=os.environ["QAI_HUB_API_TOKEN"]))

          jobs = {
              "backbone_prefill": (
                  "jgn1m92rp",
                  "backbone_prefill_512",
                  "breeze-backbone-prefill-sm8850-v81.dlc",
              ),
              "backbone_step": (
                  "jpy8jnxrg",
                  "backbone_step_b2",
                  "breeze-backbone-step-sm8850-v81.dlc",
              ),
          }

          result = {
              "depth": {
                  "source": "breeze-qnn-generator-sm8850-v1",
                  "link_job": "jpy8rw88g",
                  "context_bytes": 1011101696,
                  "graph_names": ["depth_prefill", "depth_step"],
                  "physical_batch": 1,
              }
          }

          for key, (job_id, graph, filename) in jobs.items():
              job = client.get_job(job_id)
              status = job.get_status()
              if not status.success:
                  raise SystemExit(f"cached AI Hub job {job_id} is not successful: {status}")
              model = job.get_target_model()
              if model is None:
                  raise SystemExit(f"cached AI Hub job {job_id} has no DLC")
              path = root / filename
              model.download(str(path))
              if not path.is_file() or path.stat().st_size < 100_000:
                  raise SystemExit(f"bad DLC download: {path}")
              result[key] = {
                  "graph": graph,
                  "compile_job": job_id,
                  "compile_url": job.url,
                  "dlc_bytes": path.stat().st_size,
                  "runtime": "qnn_dlc",
                  "reused": True,
              }

          (root / "qai-hub-job.json").write_text(
              json.dumps(
                  {
                      "device": os.environ.get("QAI_DEVICE", "Samsung Galaxy S26 (Family)"),
                      "contexts": result,
                  },
                  indent=2,
              ) + "\n"
          )
          print(json.dumps(result, indent=2))
          PY

          ls -lh "$ROOT"/*
          df -h /

      - name: Validate proven depth context
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/build/breeze-qnn-generator"
          qnn-context-binary-utility             --context_binary "$ROOT/breeze-depth-sm8850-v81.bin"             --json_file "$ROOT/breeze-depth-sm8850-v81.bin.info.json"

          python - "$ROOT/breeze-depth-sm8850-v81.bin.info.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          info = data["info"]
          soc = int(info["socModel"])
          arch = int(info["contextMetadata"]["info"]["dspArch"])
          graphs = info.get("graphs", [])
          if soc != 87 or arch != 81:
              raise SystemExit(f"wrong depth target: soc={soc} arch={arch}")
          if len(graphs) != 2:
              raise SystemExit(f"expected two depth graphs, found {len(graphs)}")
          print("validated proven depth context", "soc", soc, "arch", arch, "graphs", len(graphs))
          PY

      - name: Build backbone contexts without recompiling models
        shell: bash
        env:
          QAI_HUB_API_TOKEN: ${{ secrets.QAI_HUB_API_TOKEN }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/build/breeze-qnn-generator"
          TOOL="${RUNNER_TEMP}/qai-appbuilder/tools/skills/qai-runner-skill/scripts/qai_dev_gen_contextbin_x86.py"
          export QAIRT_SDK_ROOT="$QNN_SDK_ROOT"
          export LD_LIBRARY_PATH="$QNN_SDK_ROOT/lib/x86_64-linux-clang:${LD_LIBRARY_PATH:-}"
          test -s "$TOOL"

          validate_one() {
            local bin="$1"
            local info="$bin.info.json"
            qnn-context-binary-utility --context_binary "$bin" --json_file "$info"
            python - "$info" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          info = data["info"]
          soc = int(info["socModel"])
          arch = int(info["contextMetadata"]["info"]["dspArch"])
          graphs = info.get("graphs", [])
          if soc != 87 or arch != 81:
              raise SystemExit(f"wrong native target: soc={soc} arch={arch}")
          if len(graphs) != 1:
              raise SystemExit(f"expected one backbone graph, found {len(graphs)}")
          print("validated backbone context", "soc", soc, "arch", arch)
          PY
          }

          local_prepare() {
            local dlc="$1"
            local out="$2"
            rm -f "$out" "$out.info.json"
            for opt in 3 2 1 0; do
              echo "=== local QAIRT prepare: $(basename "$dlc") O=$opt ==="
              set +e
              python "$TOOL"                 --dlc "$dlc"                 --output "$out"                 --backend htp                 --soc_model 87                 --dsp_arch v81                 --vtcm_mb 8                 --opt_level "$opt"                 --pd_session unsigned                 >"$out.O$opt.log" 2>&1
              rc=$?
              set -e
              cat "$out.O$opt.log"
              if [ "$rc" -eq 0 ] && [ -s "$out" ]; then
                if validate_one "$out"; then
                  echo "local QAIRT prepare succeeded O=$opt"
                  return 0
                fi
              fi
              rm -f "$out" "$out.info.json"
            done
            return 1
          }

          hub_link() {
            local job_id="$1"
            local out="$2"
            local name="$3"
            python - "$job_id" "$out" "$name" <<'PY'
          import os, sys
          import qai_hub as hub

          job_id, output, name = sys.argv[1:4]
          client = hub.Client(hub.ClientConfig(api_token=os.environ["QAI_HUB_API_TOKEN"]))
          device = hub.Device(os.environ["QAI_DEVICE"])
          compile_job = client.get_job(job_id)
          status = compile_job.get_status()
          if not status.success:
              raise SystemExit(f"compile job is not successful: {job_id}")
          model = compile_job.get_target_model()
          if model is None:
              raise SystemExit(f"compile job has no DLC: {job_id}")

          errors = []
          for opt in (3, 0):
              link = client.submit_link_job(
                  [model],
                  device=device,
                  name=f"{name} O{opt}",
                  options=f"--qnn_options default_graph_htp_optimizations=O={opt}",
              )
              link_status = link.wait()
              print("link", link.job_id, link.url, link_status.code, link_status.message)
              if link_status.success:
                  target = link.download_target_model(output)
                  if target:
                      print("AI Hub single-DLC link succeeded", link.job_id)
                      sys.exit(0)
              errors.append(f"{link.job_id}:{link_status.message or link_status.code}")
          raise SystemExit("AI Hub single-DLC link failed: " + " | ".join(errors))
          PY
          }

          build_one() {
            local dlc="$1"
            local out="$2"
            local job_id="$3"
            local name="$4"

            if ! local_prepare "$dlc" "$out"; then
              echo "Local QAIRT prepare failed; falling back to Qualcomm AI Hub single-DLC LinkJob"
              rm -f "$out" "$out.info.json"
              hub_link "$job_id" "$out" "$name"
              test -s "$out"
              validate_one "$out"
            fi

            rm -f "$dlc"
            df -h /
          }

          build_one             "$ROOT/breeze-backbone-prefill-sm8850-v81.dlc"             "$ROOT/breeze-backbone-prefill-sm8850-v81.bin"             "jgn1m92rp"             "Breeze TTS 2 backbone prefill SM8850 context"

          build_one             "$ROOT/breeze-backbone-step-sm8850-v81.dlc"             "$ROOT/breeze-backbone-step-sm8850-v81.bin"             "jpy8jnxrg"             "Breeze TTS 2 backbone AR1 SM8850 context"

          ls -lh "$ROOT"/*.bin
          df -h /

      - name: Split release assets and build manifest
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("build/breeze-qnn-generator")
          release = root / "release"
          release.mkdir(exist_ok=True)
          hub = json.loads((root / "qai-hub-job.json").read_text())
          chunk_size = 1900 * 1024 * 1024

          def split_context(source_name, prefix):
              source = root / source_name
              whole = hashlib.sha256()
              parts = []
              total = 0
              with source.open("rb") as src:
                  index = 0
                  while True:
                      data = src.read(chunk_size)
                      if not data:
                          break
                      index += 1
                      name = f"{prefix}.part{index:02d}.bin"
                      (release / name).write_bytes(data)
                      sha = hashlib.sha256(data).hexdigest()
                      whole.update(data)
                      total += len(data)
                      parts.append({"file": name, "bytes": len(data), "sha256": sha})
              if total != source.stat().st_size:
                  raise SystemExit(f"split mismatch: {source_name}")
              return {"bytes": total, "sha256": whole.hexdigest(), "parts": parts}

          contexts = {
              "depth": split_context(
                  "breeze-depth-sm8850-v81.bin",
                  "breeze-depth-sm8850-v81",
              ),
              "backbone_prefill": split_context(
                  "breeze-backbone-prefill-sm8850-v81.bin",
                  "breeze-backbone-prefill-sm8850-v81",
              ),
              "backbone_step": split_context(
                  "breeze-backbone-step-sm8850-v81.bin",
                  "breeze-backbone-step-sm8850-v81",
              ),
          }

          manifest = {
              "version": 4,
              "engine": "qnn-full-generator-depth-b1-backbone-b2-v4",
              "backend": "Qualcomm AI Hub QAIRT/QNN HTP",
              "source": "BreezeBlue/Breeze-TTS-2",
              "target_device": hub["device"],
              "soc_model": 87,
              "htp_arch": "V81",
              "backbone_max_seq": 512,
              "depth": {
                  "physical_batch": 1,
                  "logical_cfg": "serial-cond-uncond",
                  "graph_names": ["depth_prefill", "depth_step"],
                  "proven_link_job": "jpy8rw88g",
              },
              "backbone": {
                  "prefill_graph": "backbone_prefill_512",
                  "step_graph": "backbone_step_b2",
                  "compile_jobs": ["jgn1m92rp", "jpy8jnxrg"],
              },
              "jobs": hub["contexts"],
              "files": {"SM8850": contexts},
          }
          (release / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

          curl -fL --retry 3             https://raw.githubusercontent.com/breezeblue-ai/breeze-tts/main/LICENSE             -o build/breeze-qnn-generator/release/LICENSE-Breeze-TTS-2.txt
          cat > build/breeze-qnn-generator/release/NOTICE-Breeze-QNN-Generator.txt <<'EOF'
          Breeze TTS 2 is licensed under the BreezeBlue Research and Non-Commercial
          License Agreement. V4 reuses the previously validated SM8850/V81 batch-1
          depth context and serializes CFG branches through independent KV snapshots.
          Backbone contexts reuse the successful AI Hub QNN DLC compile jobs.
          EOF
          (cd build/breeze-qnn-generator/release && sha256sum * > SHA256SUMS.txt)
          ls -lh build/breeze-qnn-generator/release

      - name: Upload CI artifact
        uses: actions/upload-artifact@v6
        with:
          name: Breeze-QNN-Full-Generator-SM8850-v4
          path: build/breeze-qnn-generator/release/*
          retention-days: 14
          if-no-files-found: error

      - name: Publish full QNN generator release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG"               --title "Breeze Full QNN Generator SM8850 v4"               --notes "SM8850/V81 generator: proven batch-1 depth context with serial CFG branches plus QNN backbone prompt/AR1 contexts. Existing successful AI Hub compile artifacts are reused; no model recompilation."
          fi
          gh release upload "$RELEASE_TAG" build/breeze-qnn-generator/release/* --clobber
