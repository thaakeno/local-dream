name: Re-sign clean Breeze v150 APK

on:
  push:
    branches:
      - v141-stable-yue2-full
    paths:
      - '.github/workflows/resign-clean-breeze-v150.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  resign:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Restore installed-app signing key
        id: signing-key-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/localdream-ci.jks
          key: localdream-ci-signing-v1

      - name: Require existing v146-v148 key
        shell: bash
        run: |
          set -euxo pipefail
          test "${{ steps.signing-key-cache.outputs.cache-hit }}" = "true"
          test -s "$RUNNER_TEMP/localdream-ci.jks"

      - name: Download clean v150 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11327229211/zip" \
            -o "$RUNNER_TEMP/v150.zip"
          mkdir -p "$RUNNER_TEMP/v150"
          unzip -q "$RUNNER_TEMP/v150.zip" -d "$RUNNER_TEMP/v150"
          find "$RUNNER_TEMP/v150" -type f -name '*.apk' -ls

      - name: Re-sign with installed-app certificate
        shell: bash
        run: |
          set -euxo pipefail
          apk="$(find "$RUNNER_TEMP/v150" -type f -name '*.apk' | head -n 1)"
          test -s "$apk"
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -n 1)"
          test -x "$apksigner_bin"
          mkdir -p "$RUNNER_TEMP/out"
          "$apksigner_bin" sign \
            --ks "$RUNNER_TEMP/localdream-ci.jks" \
            --ks-key-alias localdream \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$RUNNER_TEMP/out/LocalDream-v150-Breeze-HTP-clean.apk" \
            "$apk"

          "$apksigner_bin" verify --verbose --print-certs "$RUNNER_TEMP/out/LocalDream-v150-Breeze-HTP-clean.apk"
          actual="$("$apksigner_bin" verify --print-certs "$RUNNER_TEMP/out/LocalDream-v150-Breeze-HTP-clean.apk" | \
            sed -n 's/^.*Signer.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')"
          expected="bff433493c171fcd31e8159ca19e64d938b8d4afe043a07be91fec0ad23f071b"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"

      - name: Upload installable v150 APK
        uses: actions/upload-artifact@v6
        with:
          name: LocalDream-v150-Breeze-HTP-clean-signed
          path: ${{ runner.temp }}/out/LocalDream-v150-Breeze-HTP-clean.apk
          if-no-files-found: error
          retention-days: 14
