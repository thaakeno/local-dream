name: Integration Kotlin compile

on:
  push:
    branches:
      - "integration/**"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-37"
      - name: Compile Kotlin UI and resources (no Qualcomm SDK required)
        run: ./gradlew :app:compileBasicDebugKotlin --no-daemon --stacktrace
