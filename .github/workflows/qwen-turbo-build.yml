name: Qwen turbo branch build

on:
  push:
    branches: [qwen-gguf-turbo-overhaul]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # The hosted runner already contains the Android SDK. Do not invoke
      # sdkmanager/setup-android here: this APK build does not need an emulator
      # or Google-TV system images, and the project deliberately keeps native
      # backend compilation outside Gradle.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_SDK_ROOT"
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-dream-qwen-turbo-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
