name: Verify experimental Breeze RVQ mode

on:
  push:
    branches:
      - breeze-fast20-cleanup-experimental
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-math:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Compile independent RVQ sampling tests
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -I app/src/main/cpp/voice/overlay/breeze/include \
            tools/breeze_qnn/test_rvq_speculation.cpp \
            -o /tmp/test_rvq_speculation
      - name: Verify speculative acceptance and residual distribution
        run: /tmp/test_rvq_speculation

  kotlin-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu hosted runners already ship Android command-line tools. The
      # setup-android@v3 action invokes the retired "tools" SDK package and
      # exits before Gradle starts, so use the runner SDK directly.
      - name: Install Android SDK 37
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37" "build-tools;36.0.0"
      - name: Check Android UI and service compile
        run: ./gradlew :app:compileBasicDebugKotlin --no-daemon --stacktrace
