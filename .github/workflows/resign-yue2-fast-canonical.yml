name: Re-sign YuE2 Fast APK with canonical Local Dream key

on:
  workflow_dispatch:
  push:
    branches:
      - qwen-fp8-turbo
    paths:
      - '.github/workflows/resign-yue2-fast-canonical.yml'

permissions:
  contents: read
  actions: write

jobs:
  resign:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Restore canonical Local Dream signing key
        id: signing-key-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/localdream-ci.jks
          key: localdream-ci-signing-v1

      - name: Require canonical signing key
        shell: bash
        run: |
          set -euxo pipefail
          test "${{ steps.signing-key-cache.outputs.cache-hit }}" = "true"
          test -s "$RUNNER_TEMP/localdream-ci.jks"

      - name: Download latest successful YuE2 Fast APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/yue2-fast"

          target_branch="yue2-fast-instrumental-htp"
          target_sha="$(curl -fsSL --retry 3             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/git/ref/heads/$target_branch"             | jq -r '.object.sha')"
          test -n "$target_sha"
          test "$target_sha" != "null"
          echo "Target YuE2 Fast SHA: $target_sha"

          build_run_id=""
          artifact_id=""
          for attempt in $(seq 1 90); do
            runs_json="$(curl -fsSL --retry 3               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${{ github.repository }}/actions/runs?branch=$target_branch&per_page=100")"

            build_run_id="$(printf '%s' "$runs_json" | jq -r --arg sha "$target_sha"               '.workflow_runs[] | select(.head_sha == $sha and .name == "Build Qwen FP8 Turbo APK") | .id'               | head -n 1)"

            if [ -n "$build_run_id" ] && [ "$build_run_id" != "null" ]; then
              run_json="$(curl -fsSL --retry 3                 -H "Authorization: Bearer $GH_TOKEN"                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "https://api.github.com/repos/${{ github.repository }}/actions/runs/$build_run_id")"
              status="$(printf '%s' "$run_json" | jq -r '.status')"
              conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion // ""')"
              echo "Fast build run=$build_run_id status=$status conclusion=$conclusion attempt=$attempt"

              if [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
                echo "YuE2 Fast build failed for $target_sha" >&2
                exit 1
              fi

              if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
                artifacts_json="$(curl -fsSL --retry 3                   -H "Authorization: Bearer $GH_TOKEN"                   -H "Accept: application/vnd.github+json"                   -H "X-GitHub-Api-Version: 2022-11-28"                   "https://api.github.com/repos/${{ github.repository }}/actions/runs/$build_run_id/artifacts?per_page=100")"
                artifact_id="$(printf '%s' "$artifacts_json" | jq -r                   '.artifacts[] | select(.name == "LocalDream-YuE2-Fast-alpha63" and .expired == false) | .id'                   | head -n 1)"
                if [ -n "$artifact_id" ] && [ "$artifact_id" != "null" ]; then
                  break
                fi
              fi
            fi
            sleep 10
          done

          test -n "$artifact_id"
          test "$artifact_id" != "null"

          curl -fL --retry 5             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip"             -o "$RUNNER_TEMP/yue2-fast.zip"
          unzip -q "$RUNNER_TEMP/yue2-fast.zip" -d "$RUNNER_TEMP/yue2-fast"
          find "$RUNNER_TEMP/yue2-fast" -type f -name '*.apk' -ls

      - name: Re-sign APK with canonical key
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager_bin="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -perm -u+x | head -n 1)"
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" "build-tools;36.0.0"

          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -n 1)"
          src_apk="$(find "$RUNNER_TEMP/yue2-fast" -type f -name '*.apk' | head -n 1)"
          test -x "$apksigner_bin"
          test -s "$src_apk"

          mkdir -p "$GITHUB_WORKSPACE/out"
          out_apk="$GITHUB_WORKSPACE/out/LocalDream_YuE2_Fast_3.0.0-alpha.63-yue2fast.2-v137-canonical.apk"

          "$apksigner_bin" sign             --ks "$RUNNER_TEMP/localdream-ci.jks"             --ks-key-alias localdream             --ks-pass pass:android             --key-pass pass:android             --out "$out_apk"             "$src_apk"

          expected="4231f002da1066b9055386ceae442394262070545a7a2202d414c8efba724af7"
          actual="$("$apksigner_bin" verify --print-certs "$out_apk" |             sed -n 's/^.*Signer.*certificate SHA-256 digest: //p' | head -n 1 |             tr -d ':' | tr 'A-F' 'a-f')"

          echo "expected signer: $expected"
          echo "actual signer:   $actual"
          test "$actual" = "$expected"
          "$apksigner_bin" verify --verbose "$out_apk"
          ls -lh "$out_apk"

      - name: Upload canonical compatible APK
        uses: actions/upload-artifact@v6
        with:
          name: LocalDream-YuE2-Fast-canonical-alpha63-yue2fast2-v137
          path: out/LocalDream_YuE2_Fast_3.0.0-alpha.63-yue2fast.2-v137-canonical.apk
          if-no-files-found: error
          retention-days: 14
